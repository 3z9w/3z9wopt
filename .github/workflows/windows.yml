name: Windows build and tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test optimize changes
        run: >
          go test ./... -count=1 -timeout 20m -v
          -run "^(TestOpt|TestNeedsRebootRules|TestSysSnapshotSmoke|TestDecodeRegData|TestRegWriteDetectRoundTrip|TestOpLog|TestServiceStateVerdict)"
