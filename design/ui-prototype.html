}

function verifySelf(){
  if(VER.state === 'busy') return;
  VER.state = 'busy';
  if(SET_OPEN) window.SetPanel.refresh();
  callGo('VerifySelf').then(function(r){
    VER.r = r || {};
    VER.state = (r && r.state === 'offline') ? 'done' : 'done';
    if(SET_OPEN) window.SetPanel.refresh();
  }).catch(function(e){
    VER.state = 'fail';
    VER.msg = '调用后端失败：' + e;
    if(SET_OPEN) window.SetPanel.refresh();
  });
}

/* 下载 → 校验 → 确认 → 替换。中间任何一步失败都停在原地，绝不放行到"替换"。 */
function downloadUpdate(){
  const info = UPD.info || {};
  if(!info.url || !info.sha256){ toast('没有拿到官方下载地址或指纹，先重新检查一次', 'warn'); return; }
  if(UPD.busy) return;
  setBusy(true);
  UPD.state = 'downloading';
  UPD.prog = {done:0, total:info.size || 0};
  if(SET_OPEN) window.SetPanel.refresh();
  callGo('DownloadUpdate', info.url, info.sha256).then(function(r){
    setBusy(false);
    r = r || {};
    if(r.state !== 'ok'){
      UPD.state = 'fail';
      UPD.msg = r.message || '下载失败';
      if(SET_OPEN) window.SetPanel.refresh();
      return;
    }
    UPD.localPath = r.path;
    UPD.state = 'ready';
    if(SET_OPEN) window.SetPanel.refresh();
    toast('更新包已下好并通过校验', 'ok');
  }).catch(function(e){
    setBusy(false);
    UPD.state = 'fail';
    UPD.msg = '下载失败：' + e;
    if(SET_OPEN) window.SetPanel.refresh();
  });
}

function applyUpdate(){
  if(!UPD.localPath){ toast('更新包不见了，重新下载一次', 'warn'); return; }
  askThenDo('现在替换成新版本？',
    '软件会先备份当前这份，然后把自己换掉并自动重开。'
    + '<br><br>换的过程中窗口会关一下，属正常。'
    + '如果替换失败，会自动退回现在这一版，不会两头空。',
    '替换并重启', function(){
      UPD.state = 'applying';
      if(SET_OPEN) window.SetPanel.refresh();
      callGo('ApplyUpdate', UPD.localPath).then(function(msg){
        if(msg){
          UPD.state = 'ready';
          UPD.msg = msg;
          if(SET_OPEN) window.SetPanel.refresh();
          toast(msg, 'danger');
          return;
        }
        /* 后端会自己把程序关掉，这里只留一句提示 */
        toast('正在替换，软件马上重开…', 'info');
      }).catch(function(e){
        UPD.state = 'ready';
        UPD.msg = '替换失败：' + e;
        if(SET_OPEN) window.SetPanel.refresh();
      });
    });
}

/* 垃圾清理的入口（2026-10-13 重写）：
   原来「会重启资源管理器」弹一次、「谁占着文件」再弹一次 —— 用户点一次清理要关两个窗，
   相当不友好。现在三件事（资源管理器 / 后台长项 / 占用进程）**合成一个窗问完**，
   先把要问的都查出来，再开窗；查不到占用也不许挡住清理。
   🔴 只有这三种情况才开窗：都不涉及 → 不打扰，直接清。 */
/* 连点闸门（2026-10-14）：用户点了没反应就会一直点，每一次都往后端压一次
   5~9 秒的占用探测，越点越慢、越慢越点。这里一次只放一个进去，其余直接忽略。 */
let cleanStarting = false;

/* 点下去的 0.1 秒内界面必须有变化 —— 没变化用户就认为"点不动"，
   哪怕后端其实正在算。这是这次事故的直接诱因。 */
function cleanBtnBusy(on, txt){
  document.querySelectorAll('[data-doclean]').forEach(function(b){
    if(on){ b.disabled = true; b.dataset.busy = '1'; b.innerHTML = ico('refresh',16)+txt; }
    else if(b.dataset.busy){ delete b.dataset.busy; b.disabled = false; updateCleanSel(); }
  });
}

function cleanStart(sel){
  if(cleanStarting) return;                 /* 已经在走了：忽略这一下 */
  sel = (sel || []).filter(function(it){ return it.on; });
  if(!sel.length){ toast('还没勾选要清理的项目','warn'); return; }
  cleanStarting = true;
  cleanBtnBusy(true, '正在检查占用程序…');
  let guard = 0;
  const done = function(){ if(guard) clearTimeout(guard); cleanStarting = false; cleanBtnBusy(false); };
  /* 兜底：万一哪个分支没走到 done（异常、后端不回），40 秒后也得把按钮还给用户。
     按钮永久转圈比慢更糟糕 —— 那就真成"点不动"了。 */
  guard = setTimeout(done, 40000);
  const hits = sel.filter(function(it){ return it.ip === 'explorer'; });
  /* 分钟级、放到后台跑的项也要说一声（2026-10-11 用户要求：和完成页那句"它还在后台跑"对上），
      —— 用户可以就地取消，也可以"返回检查"去结果页找它。 */
  const aHits = sel.filter(function(it){ return it.asy; });
  const quiet = !hits.length && !aHits.length;
  /* 弹窗一开就有遮罩挡着，背后按钮点不到 → 这时候把按钮放开，别一直转圈 */
  const openIt = function(lks){ done(); openCleanConfirm(sel, hits, aHits, lks || []); };
  const goRun  = function(s){ done(); runClean(s); };
  if(!hasGo()){                       /* 预览/壳里：查不了占用，按老规矩只提示该提示的 */
    if(quiet) goRun(sel); else openIt([]);
    return;
  }
  const ids = sel.map(function(it){ return it.id; }).filter(Boolean);
  if(ids.length !== sel.length){      /* 有项没有 id，问不了后端，别卡住用户 */
    if(quiet) goRun(sel); else openIt([]);
    return;
  }
  callGo('JunkWhoLocks', ids).then(function(lks){
    const list = (lks || []).filter(function(l){ return l && l.pid; });
    if(quiet && !list.length){ goRun(sel); return; }   /* 没人占着、也没要提示的 → 直接清 */
    openIt(list);
  }).catch(function(e){
    /* 查占用者失败不该挡住清理 —— 照常清，最多还是清不干净，别让用户卡在这 */
    try{ callGo('DebugLog', 'JunkWhoLocks 失败: ' + (e && e.message ? e.message : e)); }catch(_){}
    if(quiet) goRun(sel); else openIt([]);
  });
}

/* 清理前唯一的那个确认窗：hits（会重启资源管理器）/ aHits（后台长项）/ lockers（占用进程）
   哪块有内容就显示哪块，用户在这一窗里决定完，后面不再问。 */
/* 清理确认弹窗的标题：项数与体积并列 —— 用户是在知道规模的前提下按按钮的。
   ⚠️ 2026-10-15：必须写明「选中的」，光说「这 34 项吗」会和下面那堆程序名撞车，
     用户会把 34 当成被占程序的数量，以为只清那几项（用户原话）。
     打开弹窗和勾选变化都走这一个函数 —— 标题与按钮的数字永远同源，不会互相矛盾。 */
function confirmTitle(n, bytes){
  if(!n) return '还没勾选任何项';
  return '确定清理选中的这 <b>' + n + '</b> 项'
    + (bytes ? ('（能腾出 ' + fmtSize(bytes) + '）') : '') + '？';
}

function openCleanConfirm(sel, hits, aHits, lockers){
  hits = hits || []; aHits = aHits || []; lockers = lockers || [];
  const box = document.getElementById('modalBox');
  let started = false;   /* 闸门：pointerup 兜底与 click 可能都触发，清理只能启动一次 */
  const startIt = function(){
    if(started) return;
    started = true;
    closeModal();
    const pick = sel.filter(function(it){ return it.on; });
    /* 取证：这次点下去到底走到哪一步、传了几个 id —— 界面上只一闪而过，
       下次再说"点了没反应"时能直接翻日志，不用靠猜 */
    const pids = lkCheckedPids(box);
    try{ callGo('DebugLog', 'confirm start: sel=' + sel.length + ' picked=' + pick.length
      + ' ids=' + pick.filter(function(it){ return !!it.id; }).length + ' hasGo=' + hasGo()
      + ' lockers=' + lockers.length + ' kill=' + pids.length); }catch(e){}
    if(!pick.length){ toast('全部取消了，这次不清理','warn'); return; }
    if(!pids.length){ runClean(pick); return; }        /* 没勾任何进程：照常清 */
    callGo('KillLockers', pids).then(function(res){
      /* 关掉几个要说，没关掉的更要说清楚 —— 但**不能一条一个弹窗**：
         2026-10-15 真机：勾了十来个进程，屏幕上连着一串「无法关闭 XXX」，
         用户第一反应是「这软件不行」。翻回后台日志才发现，那些全是 Windows 保护的
         系统进程（解释它们关不掉是常态、也不影响清理），跟"清理失败"压根不是一回事。
         → 「已跳过：」开头的是系统不给关，聚成一句话；其余才是真失败，照实逐条报。 */
      const ok = (res || []).filter(function(r){ return r && r.ok; }).length;
      const bad = (res || []).filter(function(r){ return r && !r.ok; });
      const soft = bad.filter(function(r){ return /^已跳过/.test(r.err || ''); });
      /* 2026-10-15 加了「关掉又自己起来」这一类：ToDesk 这类被后台服务重新拉起的软件。
         它跟"受保护"不是一回事，也跟"我们没本事"不是一回事 ——
         说错归类，用户要么以为谁来了都关不掉，要么以为这工具不行。 */
      const revived = soft.filter(function(r){ return /自己又起来了/.test(r.err || ''); });
      const guarded = soft.filter(function(r){ return !/自己又起来了/.test(r.err || ''); });
      const failed  = bad.filter(function(r){ return !/^已跳过/.test(r.err || ''); });
      if(ok) toast('已关闭 ' + ok + ' 个程序', 'ok');
      if(guarded.length) toast(guarded.length + ' 个是 Windows 保护的系统进程，谁都关不掉，不影响清理', 'warn');
      if(revived.length) toast(revived.length + ' 个关掉后自己又起来了（有后台服务在拉它们），它们占的文件只能等重启再删', 'warn');
      failed.slice(0, 2).forEach(function(r){ toast((r.name || r.pid) + '：' + (r.err || '没关掉'), 'warn'); });
    }).catch(function(e){ toast('关闭程序时出错：' + e, 'warn'); })
      .then(function(){ runClean(pick); });
  };
  if(!box){ if(sel.length){ startIt(); } return; }
  /* 点「返回检查」：回到结果页，把这几项所在的大类展开并高亮滚过去 ——
     用户想要"第一时间找到并取消"，只关掉弹窗是做不到的 */
  const goBack = function(){
    closeModal();
    CLEAN_HL = {};
    hits.concat(aHits).forEach(function(it){ CLEAN_HL[junkUid(it)] = 1; });
    catList().forEach(function(c){
      const live = catLive(c, cleanScannedGroups);
      if(live.some(function(it){ return CLEAN_HL[junkUid(it)]; })) GRP_FOLD[c.c] = false;
    });
    render();
    const el = document.querySelector('.cat-i.hl');
    if(el && el.scrollIntoView) el.scrollIntoView({block:'center'});
  };
  const refreshBtn = function(){
    const pick = sel.filter(function(it){ return it.on; });
    const n = pick.length;
    /* 勾了进程就直说"关闭程序并清理" —— 让用户知道这一下会关掉东西 */
    const killN = lkCheckedPids(box).length;
    /* 只改文字那个 span，不重写整个按钮 —— 重写 innerHTML 会把图标和文字一起换掉，
       真机上出现过"点了取消之后按钮上的字样没了"。 */
    const b = document.getElementById('mOkN');
    if(b) b.textContent = (killN ? '关闭程序并清理' : '开始清理') + (n ? ('（'+n+' 项）') : '');
    /* 标题跟着勾选走：取消两项后「标题说 34、按钮说 32」就成了新的矛盾（2026-10-15）。
       同一个 confirmTitle 出图，两处数字必然一致。 */
    const th = document.getElementById('mTitle');
    if(th) th.innerHTML = confirmTitle(n, pick.reduce(function(a, it){ return a + (it.s || 0); }, 0));
  };
  const rowOf = function(it, tag){
    return '<div class="cat-i" data-imp="u'+junkUid(it)+'" style="border-bottom:0;padding:5px 2px">'
      + '<div class="cbx '+(it.on?'on':'')+'">'+cbxInner(it.on?'on':'off')+'</div>'
      + '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:600">'+it.n
      +   (tag ? ' <span class="chip warn">'+tag+'</span>' : '')+'</div>'
      + '</div></div>';   /* ⚠️ 两个：内层文字 div + 外层的 .cat-i —— 少一个，
                              后面的小标题/第二项/底部按钮会被吞进这个 flex 行走横排（2026-10-11 实拍） */
  };
  /* 占用进程那块：能关的打勾（默认勾上），不能关的（安全软件 / 本程序自己）单独一行说清楚 */
  const canClose = lockers.filter(function(l){ return !l.protect; });
  const blocked  = lockers.filter(function(l){ return  l.protect; });
  const hasItemRows = hits.length || aHits.length;
  /* 2026-10-15 改版：程序列表**默认收起**，只留一个"要不要顺手关掉"的勾。
     原版开屏就是一排勾选项 + 一段原理说明，不懂的用户只会直接点蓝色按钮 ——
     等于软件替他决定了"关掉 QQ 和桌面"。现在默认不动任何程序，想看再点开。 */
  const lkBytes = sel.reduce(function(a, it){ return a + (it.lk || 0); }, 0);
  let lkHtml = '';
  if(lockers.length){
    if(!canClose.length){
      /* 全都关不掉（系统进程）：没得选就别给勾，说清楚就行 */
      lkHtml = '<div class="lk-tip">占着文件的都是系统进程，谁都关不掉 —— '
        + '<b>这 '+sel.length+' 项照样清理</b>，不受影响。</div>';
    }else{
      lkHtml = '<div class="lk-opt">'
        +   '<label class="lk-opt-h"><input type="checkbox" id="lkMaster" class="lk-cb">'
        +     '<span class="lk-opt-t">顺便关掉这 '+canClose.length+' 个程序，'
        +       '可以多清理 '+(lkBytes ? fmtSize(lkBytes) : '这部分')+'</span></label>'
        +   '<div class="lk-opt-d">不勾也一样清理；勾了这些程序会被关掉，要你自己重新打开，没保存的内容可能丢</div>'
        +   '<div class="lk-toggle" id="lkToggle">▸ 看看是哪 '+lockers.length+' 个程序</div>'
        /* 内容交给外层 .lk-scroll 统一滚动：这里再限高就会出现"框里套框"，两层滚动条很难用 */
        +   '<div class="lk-list" id="lkList" style="display:none;max-height:none">'
        +     canClose.map(lkRow).join('')
        +     (blocked.length
                ? '<div class="lk-blocked">这些关不掉（Windows 不允许）：'
                  /* 只报名字：why 是同一句"系统不允许关闭"，拼 N 遍就是重复啰嗦；
                     名字走 LK_INFO 翻译，System / svchost 也要说人话。 */
                  + blocked.map(function(l){
                      const h = lkHuman(l);
                      return escHome((h && h.n) || l.name || ('PID ' + l.pid));
                    }).join('　')
                  + '</div>'
                : '')
        +     '<div class="lk-warn">'+ico('warn', 14)
        +       '<span>关闭后需要你自己重新打开这些软件；没保存的内容可能会丢。</span></div>'
        +   '</div>'
        + '</div>';
    }
  }

  /* 正文（标题以外、按钮以外的部分）套一层滚动容器：三块内容叠起来会超出屏幕，
     超出时弹窗顶出视口 = 底部按钮点不到（1020×660 实测 boxH 667 > 视口 660）。 */
  /* 顺序：占用进程放最前（标题说的就是它，勾选也在这儿，装不下要滚的时候先看到它），
     资源管理器/后台长项的说明与勾选跟在后面。 */
  const midHtml = lkHtml
    + (hits.length ? '<div class="modal-d"'+(lockers.length?' style="margin-top:2px"':'')+'>'+IMPACT.explorer.d+'</div>' : '')
    + (aHits.length
        ? '<div class="modal-d"'+(hits.length?' style="margin-top:8px"':'')+'>'
          + '下面这几项要好几分钟，我们<b>不让整个清理等你</b>：它会在后台自己接着跑，'
          + '其它项一清完就出结果，<b>你可以直接返回</b>，不用干等。'
          + '跑的时候系统可能弹出它自己的进度窗口，不用管，跑完自己会关。</div>'
        : '')
    + (hasItemRows
        ? '<div class="modal-note"><div style="font-weight:650;font-size:12.5px;margin-bottom:6px">'
          +  '不想动、不想关的就在这里取消勾选，其余照常清理</div>'
          +  (hits.length
              ? '<div style="font-size:11.5px;color:var(--tx3);margin:0 0 4px">'+IMPACT.explorer.t+'（'+hits.length+' 项）</div>'
                + hits.map(function(it){ return rowOf(it, ''); }).join('')
              : '')
          +  (aHits.length
              ? '<div style="font-size:11.5px;color:var(--tx3);margin:'+(hits.length?'8px 0 4px':'0 0 4px')+'">要跑几分钟 · 后台执行（'+aHits.length+' 项）</div>'
                + aHits.map(function(it){ return rowOf(it, '后台跑'); }).join('')
              : '')
          + '</div>'
        : '');

  /* 标题直接问"要不要清"，副标题给出这次的规模 —— 用户是在知道数量的前提下做决定，
     不是对着一堆术语猜。原来标题是「关掉这些程序，能清得更彻底」，只讲手段不讲问题。
     ⚠️ 2026-10-15：标题里的数字必须写明是"**选中的**项数"。
     光写「要清理这 34 项吗？」会和下面那个「7 个程序」撞车 —— 用户以为 34 说的是那 7 个程序，
     或者以为这次只清被占的那几项。同理标题数字要跟着勾选实时刷新（见 refreshBtn），
     免得取消两项后"标题说 34、按钮说 32"，又是一对自相矛盾的数字。 */
  const selBytes = sel.reduce(function(a, it){ return a + (it.s || 0); }, 0);
  /* 副标题只补两件**别处没说全**的事：要重启桌面 / 要在后台跑几分钟（正文里有详细版）。
     总规模写在标题上、"多清多少"写在勾选项里 —— 这里不再重复，一处数字说三遍反而看不清。 */
  let sub = '';
  if(hits.length)               sub += hits.length + ' 项会重启桌面';
  if(aHits.length)              sub += (sub ? ' · ' : '') + aHits.length + ' 项要在后台跑几分钟';
  box.style.width = 'min(560px,94vw)';
  box.innerHTML = '<div class="modal-t">'
    +   '<span style="color:var(--info)">'+ico('bolt',18)+'</span>'
    +   '<span id="mTitle">'+confirmTitle(sel.length, selBytes)+'</span>'
    + '</div>'
    + (sub ? '<div class="modal-sub">'+sub+'</div>' : '')
    + '<div class="lk-scroll">' + midHtml + '</div>'
    /* 「直接删除、无法恢复」这句话 2026-10-14 从结果页挪到这里：结果页只报两个数，
       别在还没决定要不要清的时候就先教育用户；这里才是他做决定的那一下，说一次就够。 */
    + '<div style="padding:7px 2px 0;font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:5px">'
    +   ico('warn',12)+'<span>清理是<b>直接删除</b>，删掉就找不回来了</span></div>'
    + '<div class="modal-f"><button class="btn" id="mCancel">'+(hasItemRows ? '返回检查' : '取消')+'</button>'
    + '<button class="btn primary" id="mOk">'+ico('check',16)+'<span id="mOkN">开始清理（'+sel.length+' 项）</span></button></div>';
  document.getElementById('modal').classList.add('open');
  document.getElementById('mCancel').onclick = hasItemRows ? goBack : closeModal;
  document.getElementById('mOk').onclick = startIt;
  /* 内容装不下时才加淡出提示（量出来再决定，别一律加：没溢出时最后一行会被无端淡掉） */
  const sc = box.querySelector('.lk-scroll');
  if(sc && sc.scrollHeight > sc.clientHeight + 4) sc.classList.add('lk-more');
  refreshBtn();   /* 按钮上的字要跟着"勾了几个进程"走 */
  /* 勾选框变动 → 按钮文案跟着变（不重画整窗，避免"重绘吞点击"） */
  box.querySelectorAll('.lk-cb').forEach(function(cb){
    cb.addEventListener('change', refreshBtn);
  });
  /* 「顺便关掉」是总开关：勾上 = 把下面能关的都勾上并把列表展开；取消 = 一个都不关。
     ⚠️ 全部用直接改 DOM，不整窗重绘 —— 项目铁律：重绘会吞掉 click。 */
  const master = document.getElementById('lkMaster');
  const listEl = document.getElementById('lkList');
  const togEl  = document.getElementById('lkToggle');
  const setList = function(show){
    if(listEl) listEl.style.display = show ? '' : 'none';
    if(togEl) togEl.textContent = show ? '▾ 收起' : ('▸ 看看是哪 ' + lockers.length + ' 个程序');
    /* 展开后可能把底部按钮顶出可视区，量一次再决定要不要加淡出提示 */
    const sc = box.querySelector('.lk-scroll');
    if(sc) sc.classList.toggle('lk-more', sc.scrollHeight > sc.clientHeight + 4);
  };
  if(togEl) togEl.addEventListener('click', function(){
    setList(!listEl || listEl.style.display === 'none');
  });
  if(master) master.addEventListener('change', function(){
    box.querySelectorAll('.lk-cb').forEach(function(cb){
      if(cb !== master) cb.checked = master.checked;
    });
    if(master.checked) setList(true);
    refreshBtn();
  });
  /* 「重绘吞点击」兜底（项目铁律）：浏览器只在 mousedown/mouseup 命中同一元素时才派发 click，
     中间只要发生一次重绘，click 就不派发、且无任何报错 —— 用户看到的就是"点了没反应"。
     这里按下时记一笔，抬起时即便目标已被换掉也照执行（配合 startIt 的闸门，不会重复跑）。 */
  const okBtn = document.getElementById('mOk');
  if(okBtn && window.PointerEvent){
    let pressed = false;
    const bind = function(el, fn){ el.addEventListener(fn[0], fn[1]); };
    bind(okBtn, ['pointerdown', function(){ pressed = true; }]);
    bind(document, ['pointerup', function(){
      if(!pressed) return;
      pressed = false;
      const m = document.getElementById('modal');
      if(m && m.classList.contains('open')) startIt();   /* 弹窗还开着 = click 没派发成 */
    }]);
  }
  document.querySelectorAll('[data-imp]').forEach(function(row){
    row.addEventListener('click', function(){
      const it = junkByU(+row.dataset.imp.slice(1));
      if(!it) return;
      it.on = !it.on;                 /* 直接改这一项：回到结果页时它的勾选状态就是这个 */
      const c = row.querySelector('.cbx');
      if(c){ c.className = 'cbx ' + (it.on?'on':''); c.innerHTML = cbxInner(it.on?'on':'off'); }
      refreshBtn();
    });
  });
}

var SPLASH_T0 = Date.now();
/* 取已内嵌品牌 logo 的 src 来复用 —— 绝不把那段 base64 再抄一遍（抄一遍 = 图又嵌一份，白涨体积）。
   .splash-logo 是静态 HTML 里的元素，一直在；万一取不到就返回空串，退化成没图也不报错。 */
function brandLogoHtml(cls){
  const el = document.querySelector('.splash-logo');
  const src = el ? (el.getAttribute('src') || '') : '';
  return src ? ('<img class="' + (cls || '') + '" alt="" src="' + src + '">') : '';

/* 结果页先让用户看一眼品牌：logo 呼吸 BEAT_MS 毫秒，再画真正的结论。
   renderFinal 必须是「幂等」的（只写这一个容器），重复执行也没事 ——
   🔴 兜底很重要：动画只能延缓结果，绝不能吞掉结果。任何一步出问题，结论都必须照样出来。 */
var BEAT_MS = 700;
function brandBeat(container, tip, renderFinal){
  var done = false;
  var fire = function(){
    if(done) return; done = true;
    try{ renderFinal(); }catch(e){ if(window.console) console.error('brandBeat', e); }
  };
  /* 容器都没了（比如用户中途关掉遮罩）就直接画结论，别为了动画等 */
  if(!container || !container.isConnected){ fire(); return; }
  container.innerHTML = ''
    + '<div class="scan-card brand-beat">'
    +   '<span class="bb-mark">'+brandLogoHtml()+'<i></i></span>'
    +   (tip ? '<div class="bb-tip">'+escHome(tip)+'</div>' : '')
    + '</div>';
  setTimeout(fire, BEAT_MS);
}
function splashDone(){
  const s = document.getElementById('splash');
  if(!s || s.classList.contains('hide')) return;
  window.__splashDone = true;
  /* 至少露脸 1.5s：首屏其实几百毫秒就好了，不压住的话动画只闪一下、比不做还廉价。
     这是"最小显示时长"，不是假进度 —— 到点就走，不装作在算什么。
     （原 550ms 实测还是一闪而过，用户看不见。） */
  /* 一轮 logo 光环约 2.3s，让动画完整走完一圈再收：看得清才算数，别急着掀桌 */
  const waited = Date.now() - SPLASH_T0;
  const delay = waited < 2400 ? (2400 - waited) : 0;
  setTimeout(function(){
    s.classList.add('hide');
    setTimeout(function(){
      s.classList.add('done');
      /* 遮罩真退场之后软件本体才淡入 —— 顺序不能反，否则等于还是"被盖住" */
      document.body.classList.remove('booting');
    }, 480);
  }, delay);
}

  /* 设置齿轮（2026-10-13）：从下面那个 window.runtime 块里挪出来了 ——
     设置现在是弹窗，浏览器直开预览时也该点得开，不该只在 exe 里能用。 */
  const tbSetBtn = document.getElementById('tbSet');
  if(tbSetBtn){ tbSetBtn.innerHTML = ico('gear',17); tbSetBtn.onclick = function(){ window.SetPanel.open(); }; }

  /* 侧栏「关于」：关于已经并进设置面板，这里点开的也是设置窗（直接停在「关于」面）。
     ⚠️ 绑在 window.runtime 块**外面** —— 塞进去的话浏览器直开预览就点不动（跟齿轮一个道理）。 */
  const sideAboutBtn = document.getElementById('sideAbout');
  if(sideAboutBtn) sideAboutBtn.onclick = function(){ window.SetPanel.open('about'); };

  /* 无边框窗口：最小化 / 最大化 / 关闭交给 Wails runtime（浏览器打开时按钮只是装饰） */
  if(window.runtime){
    const wm = document.getElementById('winMin'), wx = document.getElementById('winMax'), wc = document.getElementById('winClose');
  /* 赞赏：二维码文件放 frontend/dist/zanshang-qr.png 即自动出现（后端 SvcLinks().reward 会给文件名） */
  window.rewardOpen = function(){
    callGo('SvcLinks').then(function(l){
      const file = (l && l.reward) || '';
      const box = document.getElementById('modalBox');
      const doShow = function(src){
        if(!box){ return; }
        box.innerHTML = '<div class="modal-t">' + ico('heart',18) + ' 赞赏支持</div>'
          + '<div class="modal-d">这软件不收钱，也不锁功能。要是帮你省了事，可以请大叔喝杯咖啡。</div>'
          + '<div style="text-align:center;margin:6px 0 4px">'
          +   '<img src="' + src + '" alt="赞赏码" style="width:240px;max-width:100%;border-radius:14px;border:1px solid var(--stroke)">'
          +   '<div style="font-size:11.5px;color:var(--tx3);margin-top:8px">微信扫码 · 金额随意</div>'
          + '</div>'
          + '<div class="modal-f"><button class="btn" id="rwCopy">复制官网地址</button>'
          + '<button class="btn primary" id="rwClose">知道了</button></div>';
        document.getElementById('modal').classList.add('open');
        document.getElementById('rwClose').onclick = closeModal;
        document.getElementById('rwCopy').onclick = function(){
          callGo('CopyText', (l && l.site) || 'https://www.3z9w.com').then(function(msg){ toast(msg ? ('复制失败：' + msg) : '官网地址已复制', msg ? 'danger' : 'ok'); });
        };
      };
      if(!file){ toast('赞赏码没打包进来（frontend/dist/zanshang-qr.png）', 'warn'); return; }
      doShow('/' + file);
    }).catch(function(e){ toast('赞赏码读取失败：' + e, 'danger'); });
  };
  window.tbOpen = function(u){
    if(!u) return;
    try{ window.runtime.BrowserOpenURL(u); }
    catch(_){ callGo('CopyText', u).then(function(){ toast('已复制链接：' + u, 'ok'); }); }
  };
  const tbRew = document.getElementById('tbReward');
  if(tbRew){ tbRew.innerHTML = ico('heart',17); tbRew.onclick = function(e){ e.stopPropagation(); window.rewardOpen(); }; }
  /* 设置齿轮的绑定已经挪到上面（window.runtime 块外面），这里不再重复绑 */
  /* 首页的按钮绑在 bindHomeExtras() 里（每次重绘后都要重绑），
     这里不再绑 —— 只绑一次的话，页面重绘后按钮全是死的 */
  if(wm) wm.onclick = function(){ window.runtime.WindowMinimise(); };
    if(wx) wx.onclick = function(){ window.runtime.WindowToggleMaximise(); };
    if(wc) wc.onclick = function(){ window.runtime.Quit(); };
    /* 拖动窗口：CSS 的 --wails-draggable 是首选通道，这里再兜一层 JS ——
       按住标题栏空白处就手动发起拖动，双击标题栏最大化/还原（Windows 习惯） */
    var tb = document.querySelector('.titlebar');
    if(tb){
      var isUI = function(e){
        var t = e.target;
        return !!(t && t.closest && t.closest('button,input,select,a,.tb-search,.brand'));
      };
      tb.addEventListener('mousedown', function(e){
        if(e.button !== 0 || isUI(e)) return;
        if(window.runtime && window.runtime.WindowStartDrag) window.runtime.WindowStartDrag();
      });
      tb.addEventListener('dblclick', function(e){
        if(isUI(e)) return;
        if(window.runtime && window.runtime.WindowToggleMaximise) window.runtime.WindowToggleMaximise();
      });
    }
  }
  /* 壳里：先把内置示意数据整体扔掉，再拉真清单 —— 保证"假数字"一帧都不会出现 */
  if(inWails()){ JUNK = []; catalogState = 'loading'; loadCatalog(); }
  /* 本机配置数据：首页「已开机」与实时状态卡脚注、关于页、本机配置页都要用它。
     启动时读一次（几百毫秒），之后进本机配置页直接用这份 —— 不为同一份数据读两遍。
     loadPC 自带 hasGo 判断与并发去重，浏览器预览（没有后端）时它静默跳过。 */
  if(typeof window.loadPC === 'function') window.loadPC();
  paintIcons(document.body);   /* 侧栏底部不在 nav/content 里，必须单独刷一次，否则图标永远是空的 */
  buildNav();
  go('home');

  document.getElementById('cmdOpen').addEventListener('click', openCmd);
  document.getElementById('cmdk').addEventListener('click', function(e){ if(e.target.id==='cmdk') closeCmd(); });
  document.getElementById('cmdkInput').addEventListener('input', function(e){ renderCmd(e.target.value); });
  document.getElementById('cmdkInput').addEventListener('keydown', function(e){
    if(e.key==='ArrowDown'){ cmdSel = Math.min(cmdList.length-1, cmdSel+1); markCmd(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ cmdSel = Math.max(0, cmdSel-1); markCmd(); e.preventDefault(); }
    else if(e.key==='Enter'){ runCmd(cmdSel); }
  });
  document.getElementById('themeBtn').addEventListener('click', function(){
    switchTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
  });
  document.getElementById('collapseBtn').addEventListener('click', function(){
    const sb = document.getElementById('sidebar');
    const on = sb.classList.toggle('collapsed');
    const ic = this.querySelector('.ni');
    if(ic) ic.innerHTML = ico(on ? 'unfold' : 'fold', 16);   /* 折叠后箭头翻向，暗示点它能回来 */
    const lb = this.querySelector('span:not(.ni)');
    if(lb) lb.textContent = on ? '展开侧栏' : '收起侧栏';
    /* 缝上那个小圆钮没有文字，全靠悬停提示说明它现在点了会怎样 */
    this.title = this.ariaLabel = on ? '展开侧栏' : '收起侧栏';
    const tip = document.getElementById('navTip'); if(tip) tip.classList.remove('show');
    moveRail();
  });
  initNavTip();
  document.getElementById('nav').addEventListener('click', function(e){
    const b = e.target.closest('.nav-item'); if(b) go(b.dataset.page);
  });
  document.querySelector('.side-foot').addEventListener('click', function(e){
    const b = e.target.closest('[data-page]'); if(b) go(b.dataset.page);
  });
  /* ⚠️ 这里原来有一条 document 级委托：「点到 .switch 就 toggle('on')」。
     它只改外观、不接任何后端 —— 设置页那些开关以前就是这么假的（改完刷新就回去了），
     2026-10-13 重做时删掉，改成设置页自己按 data-set 绑真逻辑。别再往这里加回来。 */
  document.addEventListener('keydown', function(e){
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); }
    else if(e.key==='Escape'){ closeCmd(); closeModal(); }
  else if(e.key==='F5'){ e.preventDefault(); reloadCurrentPage(); }
  });
  /* 真数据（GetLivePerf）和演示数据二选一，不许同时往 SERIES 里写 */
  if(!hasGo()) tick();
  tickClock(); setInterval(function(){ tickClock(); if(!hasGo()) tick(); }, 1000);
  initSparks();
  frame();
  window.addEventListener('resize', initSparks);
  splashDone();      /* 首屏已经画出来了（哪怕还是骨架屏），收掉启动遮罩 */
}
/* 折叠态的名称浮层：图标省了，名称不能省（VS Code / Win11 的通行做法） */
function initNavTip(){
  const sb = document.getElementById('sidebar');
  const tip = document.createElement('div');
  tip.className = 'nav-tip'; tip.id = 'navTip';
  document.body.appendChild(tip);
  sb.addEventListener('mouseover', function(e){
    if(!sb.classList.contains('collapsed')){ tip.classList.remove('show'); return; }
    const b = e.target.closest('.nav-item,.side-mini,.side-cta');
    if(!b){ tip.classList.remove('show'); return; }
    const name = (b.id === 'collapseBtn') ? '展开侧栏' : (PAGE_NAME[b.dataset.page] || '');
    if(!name){ tip.classList.remove('show'); return; }
    tip.innerHTML = name + (b.dataset.page === 'svc' ? '<span class="nt-sub">远程修电脑 · 1V1 接单</span>' : '');
    tip.classList.add('show');
    const r = b.getBoundingClientRect();
    tip.style.left = (r.right + 12) + 'px';
    tip.style.top = Math.max(10, r.top + r.height/2 - tip.offsetHeight/2) + 'px';
  });
  sb.addEventListener('mouseleave', function(){ tip.classList.remove('show'); });
  sb.addEventListener('click', function(){ tip.classList.remove('show'); });
}
function switchTheme(t){
  /* View Transitions：主题切换走一次圆形揭示，比硬切有质感；老浏览器直接切 */
  if(document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.startViewTransition(function(){ setTheme(t); });
  } else setTheme(t);
}
function markCmd(){
  const box = document.getElementById('cmdkList');
  box.querySelectorAll('.cmdk-i').forEach(function(x,i){ x.classList.toggle('sel', i===cmdSel); });
  const s = box.querySelector('.cmdk-i.sel'); if(s) s.scrollIntoView({block:'nearest'});
}

/* 各页交互已在 render() 里统一补绑（含局部重绘），这里不再重复绑定 */

init();

</script>
</body>
</html>
