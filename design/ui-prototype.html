<script>
/* ════════════════════════════════════════════════════
   本机配置页独立文件加载器（2026-10-10）
   ---------------------------------------------------------------------------
   为什么用**同步 XHR + eval**，不用 <script src>：

   Wails 只对 /index.html 注入 runtime.js / ipc.js，那两个脚本是同步的，
   注入完成后 window.go 才就位。而外链 <script src="pcinfo.js"> 默认 async，
   会晚于本页内联脚本执行 —— 表现是「一进本机配置页全是未获取到」，
   因为 renderPc 还没定义/后端还没通。

   同步 XHR 会在解析到这个位置时阻塞，把 pcinfo.js 的顶层定义（含
   window.renderPc / window.loadPC）全部装好，之后 init() → go('pcinfo') 就能用。

   两种环境都要能跑：
     · exe 里（Wails 资产服务器）：GET /pcinfo.js 正常返回
     · 浏览器直开设计预览（file://）：XHR 读本地文件受同源限制，
       这里已经 try/catch 兜住，读不到就静默降级（那一页会显示不可用，
       不影响其余 14 页 —— 这正是"拆文件"要冒的风险，所以做了兜底）
*/
(function(){
  var src = 'pcinfo.js';
  var code = '';
  try{
    var x = new XMLHttpRequest();
    x.open('GET', src, false);       /* 同步 —— 关键 */
    x.send(null);
    if(x.status === 200 || x.status === 0) code = x.responseText;
  }catch(e){ code = ''; }

  /* 必须用**直接 eval**（形如 eval(code) 而不是 (0,eval)(code)）：
     直接 eval 在当前作用域里执行，pcinfo.js 里的 var/function 才会进到本页的
     作用域，PAGES 这张表才能引用到 renderPc。
     试过 (0,eval) 间接形式：pcinfo.js 里的 renderPc 只活在它自己的 eval 作用域里，
     下面的 `const PAGES = { pcinfo: renderPc }` 直接拿到 undefined → 一进本页就崩。 */
  if(code){
    try{ eval(code); }
    catch(e){ console && console.error && console.error('pcinfo.js 载入失败', e); }
  }
  /* 载入成功与否都要保证这几个入口存在，否则 PAGES 引用 undefined 会让整页白屏 */
  if(typeof window.renderPc !== 'function'){
    window.__pcinfoMissing = true;
    window.renderPc = function(){
      return '<div class="page-head"><div class="page-title">本机配置</div>'
        + '<div class="page-sub">该页面的独立文件未载入（pcinfo.js），请检查安装包是否完整。</div></div>';
    };
  }
  if(typeof window.bindPcinfo !== 'function') window.bindPcinfo = function(){};
  if(typeof window.loadPC !== 'function') window.loadPC = function(){};
  if(typeof window.pcEnter !== 'function') window.pcEnter = function(){};
})();
</script>

<script>
/* ════════════════════════════════════════════════════
   系统优化页独立文件加载器（2026-10-11）
   ---------------------------------------------------------------------------
   跟上面「本机配置页独立文件加载器」同一个路子、同一个理由：Wails 只对 /index.html
   注入 runtime.js / ipc.js，外链 <script src="opt.js"> 默认是异步的，会晚于本页
   内联脚本执行 —— 表现就是「一进系统优化页 renderOpt 还没定义」，整页白屏。

   所以这里用**同步 XHR 读 + 直接 eval**：eval 在当前位置执行，opt.js 里的定义
   才来得及被下面的 PAGES 表引用到（(0,eval) 间接形式不行，那些定义会缩在它自己
   的作用域里，PAGES 拿到的是 undefined → 一进本页就崩）。

   ⚠️ 这个 IIFE 的作用域是"模块内"的：opt.js 里凡是要被主文件访问的（renderOpt /
     loadOptCatalog / bindOpt）都显式挂在 window 上；OPT / OPT_SEL / OPT_BUSY 也
     挂 window —— 主文件 opt:progress 事件要写同一个 OPT_BUSY，见 opt.js 顶部说明。

   两种环境都要活：
     · exe 里（Wails 资产服务器）：GET /opt.js 正常返回（main.go 里 embed + 中间件供出）
     · 浏览器双击直开设计预览（file://）：XHR 受同源限制读不到，这里 try/catch 兜住，
       静默降级成「这一页不可用」，其余页不受影响
*/
(function(){
  var src = 'opt.js';
  var code = '';
  try{
    var x = new XMLHttpRequest();
    x.open('GET', src, false);       /* 同步 —— 关键 */
    x.send(null);
    if(x.status === 200 || x.status === 0) code = x.responseText;
  }catch(e){ code = ''; }

  if(code){
    try{ eval(code); }
    catch(e){ console && console.error && console.error('opt.js 载入失败', e); }
  }
  /* 载入成功与否都要保证入口存在，否则 PAGES 引用 undefined 会让整页白屏 */
  if(typeof window.renderOpt !== 'function'){
    window.renderOpt = function(){
      return '<div class="page-head"><div class="page-title">系统优化</div>'
        + '<div class="page-sub">该页面的独立文件未载入（opt.js），请检查安装包是否完整。</div></div>';
    };
  }
  if(typeof window.loadOptCatalog !== 'function') window.loadOptCatalog = function(){};
  if(typeof window.bindOpt !== 'function') window.bindOpt = function(){};
})();
</script>

     ⚠️ 状态变量（unState / unTab / unSort…）留在模块内，主文件不要碰。

(function(){

   ① 路径完全相同 → 只算一次    ② 父目录已计入 → 子路径跳过（只算父目录）
   ③ 同一重叠组 k（如 winsxs）→ 只取组内最大者

     renew = 边用边长的（程序还在跑，清完很快写回）—— **仅作提示，仍计入主数字**
     clean = all，就是结果页那个大数字（本次真实能释放的全部，不因"会再长"而打折）
     heavy = 你的文件 / 整包（已排除 renew 部分），safe 是剩下的可重建缓存
   恒有 all === renew + heavy + safe。
   2026-10-14 改：clean 从 all-renew 改成 all。原来把浏览器/应用/AI 缓存整档（实测 664MB）
   排除在主数字外，界面看着比同类工具少一大截——但那些空间当前**确实删得掉**，
   "以后会不会回来"由清后压制（Quiet）处理，不该在这里预先扣掉。 */
/* 结果缓存（2026-10-10 加）：切页会整页重绘，同一份扫描结果在「切一次页」里
   要被算 20 多次（全量 1 + 选中 1 + 每组 2）。体积只随**扫描结果**变，
   不随渲染变 —— 所以按「扫描版本 + 参与项编号串」缓存，重绘直接命中。 */
let junkVer = 0;                 /* 扫描结果变了就 +1，缓存随之作废 */
let __junkUid = 0;
const SUM_CACHE = new Map();
function junkUid(it){ if(!it._u) it._u = ++__junkUid; return it._u; }
function junkBump(){ junkVer++; SUM_CACHE.clear(); }

/* 写「体积数据」的**唯一入口**（2026-10-10）：扫描回填必须走这里，不许直接改 it.s / it.p。
   缓存能成立的前提是「数据没变就不重算」，所以**谁改数据谁负责作废缓存**。
   收到一个入口里做，就不会出现"某个出口忘了 bump、界面一直显示上一轮的数字"：
   正常扫完 / 扫描失败（catch）/ 扫到一半用户切走 / 扫描被新一次顶掉 —— 四种情况全覆盖。 */
function setItemScan(it, bytes, files, empty, paths, e){
  it.s = bytes || 0; it.c = files || 0; it.na = !!empty; it.p = paths || [];
  /* 「能不能删」的实测结论也要跟着扫描结果走：只写进 applyCatalog 不够 ——
     那是第一次拉清单的数据（全是 0），漏了这里界面永远显示不出实况（2026-10-15 补）。 */
  if(e){
    it.lk = e.lockedBytes || 0; it.lkn = e.lockedFiles || 0;
    it.dn = e.deniedBytes  || 0; it.dnn = e.deniedFiles  || 0;
  }
  junkBump();
}
function sumSplit(list){
  /* key = 版本 + 每项（编号 + 数据指纹）。指纹是**第二道防线**：
     万一有人绕开 setItemScan 直接改了 it.s / it.p，s、c、路径条数变了也能被发现，
     不至于拿旧结果顶上。第一道防线是上面的 junkBump，别指望指纹兜住所有情况。 */
  let key = junkVer + '|';
  for(let i=0;i<list.length;i++){
    const it = list[i];
    key += junkUid(it) + ':' + (it.s||0) + '/' + (it.c||0) + '/' + (it.p ? it.p.length : -1) + '/' + (it.na?1:0) + ',';
  }
  const hit = SUM_CACHE.get(key);
  if(hit) return hit;
  const out = sumSplitRaw(list);
  if(SUM_CACHE.size > 400) SUM_CACHE.clear();
  SUM_CACHE.set(key, out);
  return out;
}
function sumSplitRaw(list){
  const acc = [], best = {};
  list.forEach(function(it){
    const hv = !!it.hv;
    const rw = !!it.rw;                        /* 边用边长：三档里它优先（deepjunk 既是又是时归它） */
    if(it.k){                                  /* 重叠组：只留组内最大者（记住它属于哪一层） */
      const cur = best[it.k];
      if(!cur || it.s > cur.b) best[it.k] = {b: it.s, hv: hv, rw: rw};
      return;
    }
    const ps = it.p || [];
    if(ps.length){ ps.forEach(function(e){ acc.push({p: String(e.p || '').toLowerCase(), b: e.b || 0, hv: hv, rw: rw}); }); return; }
    acc.push({p:'', b: it.s || 0, hv: hv, rw: rw});
  });
  const withPath = acc.filter(function(e){ return e.p; });
  const noPath   = acc.filter(function(e){ return !e.p; });
  withPath.sort(function(a,b){ return a.p.length - b.p.length; });   /* 父目录一定比子路径短 */
  const accepted = new Set();     /* 已计入的路径：查包含关系靠它，不再线性扫数组 */
  let all = 0, heavy = 0, renew = 0;
  const take = function(e){
    if(e.p) accepted.add(e.p);
    all += e.b;
    /* 三档互斥，renew 优先：既"边用边长"又是"你的文件"的（全盘零散文件）算 renew，
       否则两行都加它，加起来会对不上总数 */
    if(e.rw) renew += e.b;
    else if(e.hv) heavy += e.b;
  };
  withPath.forEach(function(e){
    if(accepted.has(e.p)) return;                 /* 同一处被另一项扫到 → 只算一次 */
    /* 逐级上溯父目录：祖先已被计入 → 自己被它盖住，跳过。
       已按长度升序处理，accepted 里的路径都比自己短，只需往上找，不必两两互比
       —— 原写法对每个候选都要扫一遍 accepted（里面还带 indexOf），是 O(n²)，
       后端是逐文件入库的，几万条路径时一次 render 就是 20 秒。 */
    let i = e.p.lastIndexOf('\\');
    while(i > 2){
      if(accepted.has(e.p.slice(0, i))) return;
      i = e.p.lastIndexOf('\\', i - 1);
    }
    if(accepted.has(e.p.slice(0, 3))) return;      /* 盘符根（c:\）被计入时，整盘都算它的 */
    take(e);
  });
  noPath.forEach(take);
  Object.keys(best).forEach(function(k){
    all += best[k].b;
    if(best[k].rw) renew += best[k].b;
    else if(best[k].hv) heavy += best[k].b;
  });
  /* clean = all：本次真实能释放的全部。「会再长」只是括号里的提示，不再从主数字里扣掉。 */
  return {all: all, safe: all - renew - heavy, heavy: heavy, renew: renew, clean: all};
}

/* ════════════════════════════════════════════════════
   迷你曲线
   ════════════════════════════════════════════════════ */
/* 40 个采样点；初始一律 0 —— 拿到真数据之前不摆假数字（2026-10-09） */
/* 初值统一 -1（"还没采到"），不是 0 —— 0 是编出来的数 */
const SERIES = {cpu:Array(40).fill(-1), mem:Array(40).fill(-1), disk:Array(40).fill(-1), net:Array(40).fill(-1), gpu:Array(40).fill(-1)};
/* DISP = 屏幕上的显示值，每帧向 SERIES 缓动靠近。曲线是「流动」的，不是每秒跳一格 */
const DISP = {}, NUM = {cpu:0, mem:0, disk:0, net:0, gpu:0};
['cpu','mem','disk','net','gpu'].forEach(function(k){ DISP[k] = SERIES[k].map(function(v){ return v < 0 ? 0 : v; }); });
let frameN = 0;
function frame(){
  ['cpu','mem','disk','net','gpu'].forEach(function(k){
    const s = SERIES[k], d = DISP[k];
    /* -1 = 这一项本机取不到（PDH 没挂上计数器）：曲线按 0 画，
       但 NUM 不许被负值拉着走，否则面板上的数字会一路往下跑 */
    for(let i=0;i<s.length;i++){ const raw = s[i] < 0 ? 0 : s[i]; d[i] += (raw-d[i])*0.13; }
    const last = s[s.length-1];
    if(last >= 0) NUM[k] += (last-NUM[k])*0.10;
  });
  const col = (getComputedStyle(document.documentElement).getPropertyValue('--info').trim()) || '#3d6bf5';
  document.querySelectorAll('svg[data-spark]').forEach(function(el){ drawSpark(el, el.dataset.spark, col); });
  if((frameN++ % 2)===0){
    const put = function(id,v){ const e = document.getElementById(id); if(e) e.textContent = v; };
    /* 取不到的项一律显示「--」，不许落成 0 —— CPU / 磁盘没挂上 PDH 计数器、
       核显机器没有 GPU 计数器都会走到这条路上，0% 读起来像真的测过。 */
    const latest = function(k){ const s = SERIES[k]; return (s && s.length) ? s[s.length-1] : -1; };
    /* 网速这一格的值是**真实的 MB/s**（来自 netIn+netOut），不再拿"百分比刻度"换算。
       原来是 SERIES.net/100*8 —— 那个 8 是拍脑袋定的满格值，换台机器就不成立。 */
    const cell = function(k){
      if(latest(k) < 0) return '--';
      return k === 'net' ? NUM.net.toFixed(1) : String(Math.round(NUM[k]));
    };
    put('stCpu', latest('cpu') < 0 ? '--' : (Math.round(NUM.cpu)+'%'));
    put('stMem', latest('mem') < 0 ? '--' : (Math.round(NUM.mem)+'%'));
    put('stDisk', latest('disk') < 0 ? '--' : (Math.round(NUM.disk)+'%'));
    put('stNet', latest('net') < 0 ? '--' : (NUM.net.toFixed(1)+' MB/s'));
    document.querySelectorAll('[data-live]').forEach(function(el){
      el.textContent = cell(el.dataset.live);
    });
  }
  requestAnimationFrame(frame);
}
function initSparks(){
  document.querySelectorAll('svg[data-spark]').forEach(function(el){ el.dataset.init = ''; });
}
function sparkPath(a,w,h,max){
  const pts = a.map(function(v,i){
    const x = a.length>1 ? (i/(a.length-1))*w : 0;
    const y = h - Math.min(v,max)/max*h;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  return 'M'+pts.join(' L');
}
function drawSpark(el,key,color){
  if(!el) return;
  const w = el.clientWidth||52, h = el.clientHeight||18, a = DISP[key] || SERIES[key], max = key==='net'?100:100;
  if(!el.dataset.init){
    el.setAttribute('viewBox','0 0 '+w+' '+h);
    el.dataset.init='1';
    el.innerHTML = '<path fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>'
      + '<path fill="'+color+'" opacity=".12" stroke="none"/>';
  }
  const p = sparkPath(a,w,h,max);
  el.querySelector('path').setAttribute('d',p);
  el.querySelectorAll('path')[1].setAttribute('d', p+' L'+w+','+h+' L0,'+h+' Z');
}
/* tick 是原型期的演示数据（随机数推曲线）：浏览器直接打开 html 时才用得上。
   接上 Wails 后真值由 perfPoller 每秒写入同一条 SERIES，两边同时跑会把真曲线
   掺进一半噪声 —— 所以这里只在没有后端时推演示值（2026-10-09 修）。 */
function tick(){
  ['cpu','mem','disk','net'].forEach(function(k){
    const a = SERIES[k], last = (a[a.length-1] < 0) ? 12 : a[a.length-1];
    let v = last + (Math.random()-0.5)*(k==='net'?26:(k==='disk'?9:13));
    if(k==='cpu'){ if(Math.random()<0.06) v += 22; }
    if(k==='net' && Math.random()<0.12) v += 60;
    v = Math.max(0.5, Math.min(99, v));
    a.push(v); a.shift();
  });
  /* 这里只负责推进目标值；真正的绘制交给 frame() 逐帧缓动，曲线才是滑的 */
}
/* 状态栏时钟：与走不走演示数据无关，任何时候都要走 */
function tickClock(){
  const t = document.getElementById('stTime');
  if(t){ const now = new Date(); t.textContent = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0'); }
}

function moveRail(){
  const nav = document.getElementById('nav');
  if(!nav) return;
  let rail = document.getElementById('navRail');
  if(!rail){ rail = document.createElement('div'); rail.id = 'navRail'; rail.className = 'nav-rail'; nav.appendChild(rail); }
  const on = nav.querySelector('.nav-item.on');
  if(!on){ rail.style.opacity = '0'; return; }
  const nr = nav.getBoundingClientRect(), r = on.getBoundingClientRect();
  rail.style.opacity = '1';

function render(){
  const box = document.getElementById('content');
  /* 这一页之前出现过（切回来 / 数据回来后的重绘）就不播整页入场 ——
     整页重建 DOM 会让 .page 重新挂上 pageIn，每次重绘都"抖"一下。
     .reveal 那条闸门（下面 revealAll）只管卡片，管不到 .page 自己。 */
  const seenMap = window.__pageSeen || (window.__pageSeen = {});
  box.innerHTML = '<div class="page' + (seenMap[cur] ? ' seen' : '') + '">' + (PAGES[cur]||renderHome)() + '</div>';
  paintIcons(box);
  bindPage();
  /* 页面内部局部重绘（扫描→结果、卸载→进度、体检→完成）也要补绑交互，
     否则重绘出来的按钮全是死的 —— 之前只在 go() 里绑，重绘后就失效了 */
  if(cur==='clean') bindClean();
  if(cur==='tools' && window.bindTools) window.bindTools();
  if(cur==='svc' && window.bindSvc) window.bindSvc();
  if(cur==='home') bindHomeExtras();
  if(cur==='pcinfo' && window.bindPcinfo) window.bindPcinfo();
  if(cur==='space' && window.bindDisk) window.bindDisk();
  if(cur==='sec' && window.bindStartup) window.bindStartup();
  if(cur==='driver' && window.bindDriver) window.bindDriver();
  if(cur==='bsod' && window.bindBsod) window.bindBsod();
  initSparks();
  countUp();
  /* 入场动画只在这一页**第一次**出现时播（2026-10-10 修）：
     清理完回首页、数据回来后的重绘都会整页重建 DOM，卡片被重新打上 .reveal
     （opacity:0 + 位移），再等 IntersectionObserver 触发才浮现 ——
     待办区和「还能做什么」就会"消失一下再冒出来"，看着像刷新/闪烁。
     这一页已经出现过就直接显示，不重播入场。 */
  const seen = window.__pageSeen || (window.__pageSeen = {});
  revealAll(!!seen[cur]);
  seen[cur] = true;
  if(cur==='home'){ animateScore(); }
  /* 进本机配置页时若还没有数据（启动那次没读到 / 后端还没就绪），这里补读一次。
     ⚠️ 必须带 __pcTried 闸门：失败态下 pcLoadDone 会再 render 一次，
     不加闸门就成了「render → 读 → 失败 → render → 再读」的死循环（每次真读几百毫秒）。
     失败之后想再试，走页面上的「重新读取」按钮 / F5 —— 那是用户主动的。 */
  if(cur==='pcinfo' && !window.PC && !window.__pcInflight && !window.__pcTried && typeof window.loadPC === 'function'){
    window.__pcTried = true;
    window.loadPC();
  }
  if(cur==='pcinfo' && window.pcEnter) window.pcEnter();
}
/* ── 交互与体验（2026-10-09 改造）──────────────────────────────────
   三件真事：
   ① F5 = 重新读取当前页的数据（跟各页的「重新检测」等价，不用去找按钮）；
   ② 开关支持键盘：Tab 聚焦后按 Enter / 空格即可切换（启动项、系统优化这类开关密集的页面）；
   ③ 「减少动效」是真开关：写进 localStorage，给 <html> 打 data-motion="off"，
      CSS 直接关掉入场与过渡动画 —— 关了之后功能完全一样，只是更干脆。 */
/* ════════════════════════════════════════════════════════════════════
   颜色规范（2026-10-09 由站长拍板，改配色前先读这一段）
   ────────────────────────────────────────────────────────────────────
   一屏之内，**大面积颜色只允许一种：品牌蓝**（--sp-grad / --info）。
     · 大色块归品牌蓝：健康球、进度条/占比条、走势线、量表、主按钮、图标底色
   绿（--ok）**只作小面积语义标记**，绝不用于填充大色块：
     · 允许：chip「已优化/基本/安全」、完成勾、状态小圆点、清理完成的一句话
     · 禁止：球、条形填充、走势线、卡片图标底色、步骤号
   琥珀（--warn）= 谨慎 / 需重启 / 接近上限；红（--danger）= 危险 / 超限。
   中性：--tx/--tx2/--tx3 文字，--glass/--stroke 面与边。
   判定口径：把界面缩到 10% 看过去 —— 只应该看到"蓝 + 灰"，其它颜色只应是零星的
   小点（语义标记）。出现第二块大面积颜色 = 违规。
   ════════════════════════════════════════════════════════════════════ */const MOTION_KEY = '3z9wopt_motion';
function motionOff(){ try{ return localStorage.getItem(MOTION_KEY) === 'off'; }catch(_){ return false; } }
function applyMotion(){
  if(motionOff()) document.documentElement.setAttribute('data-motion', 'off');
  else document.documentElement.removeAttribute('data-motion');
}
function setMotion(off){
  try{ localStorage.setItem(MOTION_KEY, off ? 'off' : 'on'); }catch(_){}
  applyMotion();
}

function bindPage(){
  applyMotion();   /* 动效偏好每次渲染都确保生效 */
  /* 磁盘空间：整页交互（磁盘卡 / 三个视图 / 钻取 / 排序 / 删除）都在 design/disk.js 里，
     挂在 #content 上做事件委托，主文件不碰（重绘吞点击是本站头号坑）。 */
  /* 系统优化：整页交互（筛选 / 预设 / 勾选 / 应用 / 还原）都在 design/opt.js 里，
     挂在 #content 上做事件委托 —— 收起、勾选只改单个节点，不整页重绘（重绘会吞点击）。 */
  if(window.bindOpt) window.bindOpt();
  /* 开关键盘可操作：Tab 聚焦 + Enter/空格切换（走各自页面的真处理器） */
  document.querySelectorAll('[data-su],[data-opt]').forEach(function(sw){
    if(sw.dataset.kbBound) return; sw.dataset.kbBound = '1';
    sw.setAttribute('tabindex', '0');
    sw.setAttribute('role', 'switch');
    sw.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); sw.click(); }
    });
  });
  /* 设置相关的绑定已搬到 bindSettings()（2026-10-13）——
     设置改成弹窗了，这里的 document 级绑定够不着弹窗里每次重绘出来的新节点。 */
  document.querySelectorAll('[data-goto]').forEach(function(el){
    if(el.dataset.gotoBound) return;      /* 每次渲染都会跑一遍，不防重会越点越多次 */
    el.dataset.gotoBound = '1';
    el.addEventListener('click', function(){ go(el.dataset.goto); });
  });
  /* 启动项的开关 2026-10-12 随整页搬到 design/startup.js（原生 checkbox + #content 委托），
     这里只保留给其它页用的纯视觉开关 —— 旧启动项页那批元素（suRetry / bootReload /
     bootReset / bootApply）已不存在，绑定它们的那段也一并删了。 */
  document.querySelectorAll('[data-sw]').forEach(function(el){
    if(el.dataset.swBound) return; el.dataset.swBound = '1';
    el.addEventListener('click', function(){ el.classList.toggle('on'); });
  });
  document.querySelectorAll('[data-drill]').forEach(function(el){
    el.addEventListener('click', function(){ drillPath.push(el.dataset.drill); render(); });
  });
  document.querySelectorAll('[data-drill-to]').forEach(function(el){
    el.addEventListener('click', function(){ drillPath = drillPath.slice(0, +el.dataset.drillTo+1); render(); });
  });
  /* 应用卸载：整页交互（Tab / 排序 / 勾选 / 卸载 / 实测体积）都在 design/uninst.js 里，
     挂在 #content 上做事件委托 —— 排序、勾选只改局部，不整页重绘（重绘会吞点击）。 */
  if(window.bindUninst) window.bindUninst();
  document.querySelectorAll('.card.hoverable,.scene,.tool-card').forEach(function(c){
    c.addEventListener('mousemove', function(e){
      const r = c.getBoundingClientRect();
      c.style.setProperty('--mx', (e.clientX-r.left)+'px');
      c.style.setProperty('--my', (e.clientY-r.top)+'px');
    });
  });
}

function wavePath(amp){
  let d = 'M-132,0';
  for(let x=-132; x<264; x+=66){
    d += ' C'+(x+8)+','+(-amp)+' '+(x+25)+','+(-amp)+' '+(x+33)+',0';
    d += ' C'+(x+41)+','+amp+' '+(x+58)+','+amp+' '+(x+66)+',0';
  }
  return d + ' L264,150 L-132,150 Z';
}
const BALL_TOP = 12, BALL_BOT = 112;

function loadPendingReboot(){

/* 上次扫描到的垃圾（2026-10-09 修）：
   原来 lastScan 从没被赋值过 —— 扫完垃圾健康分永远出不来（junkScanned() 恒为 false）。
   约定：null = 这台机还没扫过（不许给分）；数组 = 扫过了，空数组代表"扫过，0 字节"。
   只由 finishScan（真实扫描结果）与清理收尾写入，绝不手填。 */
let lastScan = null;
function lastJunkBytes(){
  if(lastScan === null || lastScan === undefined) return null;
  let sum = 0;
  lastScan.forEach(function(it){ sum += (it.bytes || 0); });
  return sum;
}
/* 把真实扫描结果写成"这台机当前有多少垃圾"：只统计这次真扫过的组、真读到的体积 */
function setJunkScanResult(groups){
  const arr = [];
  JUNK.forEach(function(g){
    if(groups.indexOf(g.g) < 0) return;          /* 没扫的组不认，不许拿旧值凑数 */
    g.items.forEach(function(it){
      if(it.na) return;                          /* na = 这台机上不存在这一项 */
      /* 首页的"有多少垃圾"与清理页同口径：只算真正能清掉的。
         「边用边长」的那部分（程序在跑、清完立刻写回）不算 ——
         否则首页永远显示一大堆，用户点进去清完发现数字没怎么降。 */
      arr.push({bytes: it.rw ? 0 : (it.s || 0)});
    });
  });
  lastScan = arr;
}
function tightDisk(){
  return DISKS.filter(function(d){
    const t = d.total || 0;
    return t > 0 && (d.free / t) < 0.15;
  })[0] || null;
}
function adviceStartups(){
  return SU.filter(function(i){ return i.enabled && i.advice === 'disable'; });
}
/* ── 待办区与扫描区彻底分开（2026-10-10 改）──────────────────────────────

     · 待办区是独立的「日常维护建议」卡，从下面的池子里随机抽 3 条，

const TODO_POOL = [

  {t:'管管开机启动项', d:'开机自启的越多，进桌面越慢；不认识的可以试着关掉', act:'去管理', page:'sec', cost:'约 1 分钟'},
  {t:'做一轮系统优化', d:'服务、电源、动画等一堆可选项，每条都写了会改什么、怎么还原', act:'去优化', page:'optimize', cost:'约 3 分钟'},
  {t:'卸载用不上的软件', d:'按占用体积排好了，先卸那几个又大又没用的', act:'去卸载', page:'appx', cost:'看情况'},
  {t:'看一眼本机配置', d:'处理器、内存条、硬盘、显卡的型号和当前状态都在这页', act:'看配置', page:'pcinfo', cost:'约 1 分钟'},
  {t:'给系统建个还原点', d:'动服务、改注册表之前留个退路，出问题能一键退回来', act:'去创建', page:'tools', cost:'约 1 分钟'},
  {t:'打开工具库挑个顺手的', d:'批处理、注册表、网络修复这些小工具都在里面', act:'去工具库', page:'tools', cost:'看情况'},
  {t:'体检一下驱动状态', d:'驱动异常会让设备不能用或性能打折，这里能看出哪个有问题', act:'去查看', page:'driver', cost:'约 1 分钟'},
  {t:'查查有没有蓝屏记录', d:'真蓝屏过就会留下记录，能看出是哪次、大概什么原因', act:'去看看', page:'bsod', cost:'约 30 秒'}
];
const TODO_N = 3;   /* 待办区固定 3 条 */
/* Fisher-Yates 洗牌后取前 3 条：同一台机每次启动抽到的不一样，但一次会话内固定 */
function pickTodos(){
  const pool = TODO_POOL.slice();
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  return pool.slice(0, TODO_N);
}
function healthChecks(){
  const list = [];
  const junk = lastJunkBytes();
  list.push(['扫描垃圾文件',
    junk === null ? '还没扫过（去垃圾清理页点「开始扫描」）' : ('扫到 ' + fmtSize(junk)),
    junk === null ? 'wait' : (junk > 1000*1000*1000 ? 'bad' : 'ok')]);
  const adv = adviceStartups();
  list.push(['核对开机启动项',
    SU.length ? (SU.length + ' 项 · 建议关 ' + adv.length + ' 项') : '正在读…',
    SU.length ? (adv.length ? 'bad' : 'ok') : 'wait']);
  const tight = tightDisk();
  list.push(['检查磁盘空间',
    DISKS.length ? (tight ? ((tight.name || tight.drive) + ' 可用不足 15%') : DISKS.length + ' 块盘空间都还够') : '正在读…',
    DISKS.length ? (tight ? 'bad' : 'ok') : 'wait']);
  const perf = window.__perf;
  const memNow = (perf && perf.mem >= 0) ? memSmooth() : -1;   /* 用均值，别秒级抖 */
  list.push(['检查内存占用',
    memNow >= 0 ? (Math.round(memNow) + '%（近 10 秒均值）') : '正在采样…',
    memNow >= 0 ? (memNow >= 85 ? 'bad' : 'ok') : 'wait']);
  list.push(['检查待重启项',
    pendingReboot === null ? '还没读到' : (pendingReboot ? '有改动等重启生效' : '没有待重启项'),
    pendingReboot === null ? 'wait' : (pendingReboot ? 'bad' : 'ok')]);
  return list;
}
/* ── 内存扣分必须站得住（2026-10-09 修）──────────────────────────────
   内存是秒级抖动的：直接用瞬时值判 >80% 扣分，占用在 80 附近徘徊时
   健康分会在 90↔100 之间每秒翻一次，球色跟着闪，看着像坏了。
   两条措施：① 取最近 10 次采样（约 10 秒）的均值 ② 给回差 ——
   进 10 分档要均值 >80，退回要 <77；进 20 分档要 >90，退回要 <87。 */
function memSmooth(){
  const h = window.__memHist || [];
  const p = window.__perf;
  if(!h.length) return (p && typeof p.mem === 'number') ? p.mem : -1;
  let s = 0;
  h.forEach(function(v){ s += v; });
  return s / h.length;
}
let MEM_PEN_STATE = 0;
/* 同一份输入连算多次结果必须一致（healthParts 会被 scoreSentence /
   heroSummary / 弹窗各调一次，不能因为被调用就改变输出） */
function memPenalty(){
  const m = Math.round(memSmooth());
  let pen;
  if(MEM_PEN_STATE === 20) pen = (m > 87) ? 20 : ((m > 77) ? 10 : 0);
  else if(MEM_PEN_STATE === 10) pen = (m > 90) ? 20 : ((m > 77) ? 10 : 0);
  else pen = (m > 90) ? 20 : ((m > 80) ? 10 : 0);
  MEM_PEN_STATE = pen;
  return {pen:pen, pct:m};
}
/* 健康分：100 分起扣，每一项扣分都有依据（healthParts 可查）；数据全无 → null */
function healthParts(){
  const parts = [];
  DISKS.forEach(function(d){
    const t = d.total || 0;
    if(!t) return;
    const used = Math.round((t - d.free) / t * 100);
    let pen = 0;
    if(used > 90) pen = 25; else if(used > 80) pen = 12; else if(used > 70) pen = 5;
    if(pen) parts.push({k:(d.name || d.drive) + ' 已用 ' + used + '%', v:'-' + pen, pen:pen, page:'space', why:'可用空间低于 15% 系统会明显变卡；点进去能一层层看到是谁占的'});
  });
  const perf = window.__perf;
  if(perf && perf.mem >= 0){
    const mp = memPenalty();
    if(mp.pen) parts.push({k:'内存已用 ' + mp.pct + '%（近 10 秒均值）', v:'-' + mp.pen, pen:mp.pen, page:'pcinfo', why:'内存吃紧时会拿硬盘顶上（体感就是卡）；先关掉不用的程序，配置页能看到内存条与占用'});
  }
  if(pendingReboot === true) parts.push({k:'有待重启才生效的改动', v:'-5', pen:5, page:'optimize', why:'有些优化项（服务、内核参数）要重启才完全生效'});
  const junk = lastJunkBytes();
  if(junk !== null && junk > 0){
    const gb = junk / 1000 / 1000 / 1000;
    let pen = 0;
    if(gb > 5) pen = 10; else if(gb > 1) pen = 5;
    if(pen) parts.push({k:'未清理垃圾 ' + gb.toFixed(1) + ' GB', v:'-' + pen, pen:pen, page:'clean', why:'临时文件、更新缓存、浏览器缓存；清掉不影响任何软件'});
  }
  return parts;
}
function healthScore(){
  if(!DISKS.length && !window.__perf && pendingReboot === null) return null;
  const pen = healthParts().reduce(function(s,p){ return s + p.pen; }, 0);
  return Math.max(0, Math.min(100, 100 - pen));
}
/* 球色必须跟着分数走：原来只在整页重绘时算 lv-*，

function ballLv(){

function junkScanned(){ return lastJunkBytes() !== null; }
function recomputeHome(){
  refreshTodos();
  CHECKS = healthChecks();
  const s = healthScore();
  /* 垃圾没扫过就不给分（2026-10-09 修）：少了这一项的账目是残缺的，
     却照样显示「100 分」加一颗绿球，第一眼会让人以为不用扫了。
     球显「--」+ 待办第一条就是「先扫一遍」，扫完立刻出分。 */
  SCORE_KNOWN = (s !== null) && junkScanned();

function perfPoller(){
  if(!hasGo()) return;

function livePeak(k){

  if(!a.length) return '--';   /* 一次都没取到就没有"峰值"可言 */

/* hover 详情那一行（「移到上面看详情」）已按站长要求去掉：
   每格自己已经写了「处理器 / 内存 / 磁盘 / 显卡」+ 峰值，不需要再靠悬停解释一行字 */
function animateScore(){
  const liq = document.getElementById('liqG'), num = document.getElementById('scoreNum'),
        ball = document.getElementById('scoreBall');
  if(!liq||!num) return;
  /* 不知道分就别演「从 0 涨到 100」这出戏：球里写 --，液面放到最底（2026-10-09） */
  if(!SCORE_KNOWN){
    num.textContent = '--';
    liq.setAttribute('transform','translate(0,'+ballY(0).toFixed(1)+')');
    if(ball) ball.classList.remove('sloshing');
    return;
  }
  window.__scoreAnim = true;
  /* 兜底：HTML 里已是终值；rAF 跑不动时 1.6s 后强制归位，绝不卡在半空 */
  let done = false;
  const settle = function(){
    done = true;
    window.__scoreAnim = false;
    liq.setAttribute('transform','translate(0,'+ballY(SCORE).toFixed(1)+')');
    num.textContent = (SCORE_KNOWN ? SCORE : '--');
    if(ball) ball.classList.remove('sloshing');
  };
  const tId = setTimeout(settle, 1600);
  liq.setAttribute('transform','translate(0,'+BALL_BOT+')');
  num.textContent = '0';
  if(ball) ball.classList.add('sloshing');
  let t0 = null;
  function step(ts){
    if(done) return;
    if(!t0) t0 = ts;
    const p = Math.min(1,(ts-t0)/1400);
    const e = 1-Math.pow(1-p,3);
    const v = SCORE*e;
    num.textContent = Math.round(v);
    /* 液面和数字共用一条 rAF：球里的水跟着数字一起往上涨，不依赖 CSS transition */
    liq.setAttribute('transform','translate(0,'+ballY(v).toFixed(1)+')');
    if(p<1) requestAnimationFrame(step); else { clearTimeout(tId); settle(); }
  }
  requestAnimationFrame(step);
}
/* 球的点击、重新体检按钮的绑定不在 animateScore 里了：
   没出分时 animateScore 会提前 return，绑在它后面的按钮就永远绑不上（点了没反应）。
   首页所有交互统一在 bindHomeExtras() 里绑 —— 每次重绘后都会跑一遍。 */
/* 体检项目与待办一律现算（healthChecks / TODOS），这里是原型期写死的样例数据，
   在别人机器上就是假报告 —— 2026-10-09 删除，改由 healthChecks() 实时生成。 */
let scoreBusy = false;
function setLiquid(v){
  const liq = document.getElementById('liqG');
  if(liq) liq.setAttribute('transform','translate(0,'+ballY(v).toFixed(1)+')');
}
function tweenScore(from,to){
  const num = document.getElementById('scoreNum');
  window.__scoreAnim = true;
  /* 兜底：后台标签页 rAF 会暂停，1.3s 后强制归位，避免数字和液面各说各话 */
  let done = false;
  const settle = function(){ done = true; window.__scoreAnim = false; setLiquid(to); if(num) num.textContent = SCORE_KNOWN ? to : '--'; };
  const tId = setTimeout(settle, 1300);
  let t0 = null;
  function step(ts){
    if(done) return;
    if(!t0) t0 = ts;
    const p = Math.min(1,(ts-t0)/950), e = 1-Math.pow(1-p,3), v = from+(to-from)*e;
    setLiquid(v);
    if(num) num.textContent = SCORE_KNOWN ? Math.round(v) : '--';
    if(p<1) requestAnimationFrame(step); else { clearTimeout(tId); settle(); }
  }
  requestAnimationFrame(step);
}
/* 体检进度做成**遮罩层**（2026-10-10 改）：
   体检过程原本铺在页面里（先是在待办卡头上，后来挪到球卡底部），
   不管放哪都会把页面撑高一截、布局往下掉一下。改成浮在页面中间的遮罩：
   不占任何布局高度，页面一动不动；点遮罩空白处或「知道了」关掉。 */
function healthMask(){

    document.body.appendChild(m);

function closeHealthMask(){

function runHealthScan(){

     原型期写死的「清出 4.7 GB / 关掉 6 个启动项」在别人机器上是假报告，已删。 */
  const checks = healthChecks();

     万一 healthChecks() 或下面那个轮询抛了异常，scoreBusy 就永远停在 true：
     球一直卡在「体检中」转圈、第二次体检也起不来，且没有任何地方会把状态放回来。
     这里挂一条比正常全流程更长的闹钟：正常走完时 scoreBusy 已复位，它自己退出。 */
  clearTimeout(window.__hcsGuard);

    +   '</div>'

    + '</div>';

      if(bar) bar.style.width = Math.round((i)/checks.length*100)+'%';

const TODO_DONE = {};

function countUp(){
  document.querySelectorAll('[data-count]').forEach(function(el){
    if(el.dataset.cu) return;
    el.dataset.cu = '1';
    const to = parseFloat(el.dataset.count);
    const fix = (el.dataset.count.indexOf('.')>=0) ? 1 : 0;
    let t0 = null;
    function step(ts){
      if(!t0) t0 = ts;
      const p = Math.min(1,(ts-t0)/620);
      const v = to*(1-Math.pow(1-p,3));
      el.textContent = fix ? v.toFixed(1) : Math.round(v);
      if(p<1) requestAnimationFrame(step); else el.textContent = fix ? to.toFixed(1) : to;
    }
    requestAnimationFrame(step);
  });
}

    var j = t.indexOf("';", i);

/* 残留文件「为什么没删掉」→ 说人话 + 什么情况下才能清掉（2026-10-10 用户要求）
   2026-10-13 改：new / gone 不再是「失败」——
     new = 活缓存，清完程序立刻写回来，这是它的正常工作方式，不是我们没删掉；
     gone = 清完就不在了，更不是失败。
   把这两类算进「没清掉」，等于把正常现象报成故障，用户会以为软件不行。
   它们从统计里摘出去（见 LEFT_FAIL），但仍单独列出给用户看一眼，不藏着。 */
const LEFT_REASON = {
  locked:{t:'正被程序占用',
    d:'这些文件被程序占着，删不动。清理时把弹窗里那个「顺便关掉占着文件的程序」勾上，再清一次就干净了；或者重启电脑后开机第一次清理。'},
  denied:{t:'受系统保护',
    d:'这些文件归系统自己管（TrustedInstaller），不是权限不够——本程序启动时已经是管理员了。这类文件任何清理软件都删不掉，微软自己也不让删，不计入清理失败。'},
  new:   {t:'活缓存，清完程序又写回来了',
    d:'这是缓存的正常行为：程序还在跑，删掉它立刻重建。关掉程序再清就不会有。不影响可用空间，不用管它。'},
  gone:  {t:'现在已经不在了',
    d:'清理过程中被别的操作带走或已重建，无需处理。'},
  /* 2026-10-14：已排进系统重启删除队列。不是失败 —— 空间确实会在下次开机时腾出来，
     但**现在还在**。写成失败或"被占用"都会骗人：写成失败他以为软件不行，
     写成被占用他会再点一次清理，而再点一次结果完全一样。 */
  reboot:{t:'已排到重启后删除',
    d:'这些文件被程序占着，已经交给系统：下次开机时会自动删掉，届时才真正腾出空间。现在就可以去干别的，不用管它们。'},
  other: {t:'这次没判断出原因',
    d:'重启电脑后开机第一次扫描清理，多半就能清掉了。'}
};
/* 真正算「清理失败」的原因：判不出来的。
   2026-10-14：locked 不再是失败 —— 被占用的文件会自动排进重启删除队列（见 reboot），
   排不上的那一小撮才叫真失败。new / gone / reboot 都不计入。 */
const LEFT_FAIL = {locked:0, denied:0, other:1, new:0, gone:0, reboot:0};
const LEFT_ORDER = ['locked','reboot','denied','other','new','gone'];
/* 「真没清掉」的量：只统计 LEFT_FAIL 的原因。
   没有逐条明细时（后端只回了总数）退回总数，并用 approx 标出来 —— 不许假装分过类。 */
function failLeft(){
  if(!cleanLeftDetail.length) return {bytes:cleanLeft, n:cleanLeftN, approx:true};
  let bytes = 0, n = 0;
  cleanLeftDetail.forEach(function(e){
    if(LEFT_FAIL[e.reason || 'other']){ bytes += (e.bytes || 0); n++; }
  });
  return {bytes:bytes, n:n, approx:false};
}
/* 这次没清掉的那部分，主要卡在哪个原因上（按字节算，不是按条数）。
   用途：完成页要按主因说不同的话 —— 「被程序占着」和「系统保护」的解决办法完全不一样，
   用同一句"关掉程序再清一次"盖过去，对系统保护的那部分就是在骗用户（他试几次都没用）。 */
function leftMainReason(){
  const by = {};
  cleanLeftDetail.forEach(function(e){
    const r = e.reason || 'other';
    if(!LEFT_FAIL[r]) return;               // 活缓存重建 / 已不在 不算"没清掉"
    by[r] = (by[r] || 0) + (e.bytes || 0);
  });
  let best = '', bv = -1;
  Object.keys(by).forEach(function(k){ if(by[k] > bv){ bv = by[k]; best = k; } });
  return best;
}
/* 「不算失败」的量（活缓存重建 / 已不在），用于给用户一句安顿话 */
function benignLeft(){
  let bytes = 0;
  cleanLeftDetail.forEach(function(e){
    if(!LEFT_FAIL[e.reason || 'other']) bytes += (e.bytes || 0);
  });
  return bytes;
}

const CAT_ON = {};     /* 大类是否参与扫描（默认全勾） */
const CAT_OPEN = {};   /* pick 页是否展开看这一类的项（默认折叠） */
const GRP_ON = {};     /* 兼容：小类勾选已由大类派生，这里只给没归类的组兜底 */
const GRP_FOLD = {};   /* 结果页每个大类是否收起（默认收起：先给总量，再按需展开） */
function catOn(c){ if(!(c.c in CAT_ON)) CAT_ON[c.c] = true; return CAT_ON[c.c]; }
function catOpen(c){ return !!CAT_OPEN[c.c]; }
function catOf(gname){
  for(let i = 0; i < CATS.length; i++){ if(CATS[i].g.indexOf(gname) > -1) return CATS[i]; }
  return null;
}
/* 这个大类在本机实际有哪些小类（后端没返回的组不显示） */
function catGroups(c){
  return c.g.filter(function(n){ return JUNK.some(function(g){ return g.g === n; }); });
}
/* 三态勾选：全选 on / 部分 part / 一个没选 off。
   勾选框里画什么由状态决定（未选就什么都不画），避免"没勾也看见个对勾"。 */
function selState(onN, allN){
  if(!allN) return 'off';
  if(onN >= allN) return 'on';
  return onN > 0 ? 'part' : 'off';
}
function cbxInner(st){
  if(st === 'on') return ico('check',12);
  if(st === 'part') return '<i class="cbx-dash"></i>';
  return '';
}
/* 改勾选框：class 与框里画什么必须一起换，否则会出现"空框里还留着对勾" */
function setCbx(el, st){
  el.className = 'cbx ' + st;
  el.innerHTML = cbxInner(st);
}
/* ── pick 页（扫描前）的逐项勾选 ──
   只有细项能单独取消，"部分选中"这个状态才存在；否则大类永远只能全选或全不选。
   这里勾的结果会**带到扫描结果里**（finishScan 认 _userSet，不覆盖用户手选）。 */
function pickCounts(){
  let all = 0, on = 0;
  catList().forEach(function(c){
    catLive(c).forEach(function(it){ all++; if(it.on) on++; });
  });
  return {all:all, on:on};
}
function updatePickSel(){
  const cats = catList();
  cats.forEach(function(c, ci){
    const live = catLive(c);
    const n = live.filter(function(it){ return it.on; }).length;
    const st = selState(n, live.length);
    /* 这一类一个都没勾 = 不扫它（后端只能按小类扫，整类不勾就别浪费时间） */
    CAT_ON[c.c] = (st !== 'off');
    const row = document.querySelector('[data-pick="'+ci+'"]');
    if(row){
      const card = row.closest('.cat-card');
      if(card) card.classList.toggle('cat-off', st === 'off');
      const box = row.querySelector('.cbx');
      if(box) setCbx(box, st);
    }
  });
  document.querySelectorAll('[data-pickitem]').forEach(function(el){
    const it = junkByU(+el.dataset.pickitem.slice(1));
    const box = el.querySelector('.cbx');
    if(it && box) setCbx(box, it.on ? 'on' : 'off');
  });

  const chip = document.querySelector('.chip[data-pickn]');
  if(chip) chip.textContent = '已选 ' + cnt.on + ' / ' + cnt.all + ' 项';

/* only 传小类名数组时，只算这些小类（结果页要用：只显示这次真扫过的小类） */
function catLive(c, only){
  const out = [];
  catGroups(c).forEach(function(n){
    if(only && only.indexOf(n) < 0) return;
    const g = JUNK.find(function(x){ return x.g === n; });
    if(g) g.items.forEach(function(it){ if(!it.na) out.push(it); });
  });
  return out;
}
/* 按稳定编号反查项（合并大类后不再用"第几组第几项"定位） */
function junkByU(u){
  let hit = null;
  JUNK.forEach(function(g){
    if(hit) return;
    g.items.forEach(function(it){ if(it._u === u) hit = it; });
  });
  return hit;
}
function catList(){ return CATS.filter(function(c){ return catLive(c).length > 0; }); }

function grpOn(g){
  const c = catOf(g.g);
  if(c) return catOn(c);
  if(!(g.g in GRP_ON)) GRP_ON[g.g] = true;
  return GRP_ON[g.g];
}
function grpFold(c){ return !(c.c in GRP_FOLD) || GRP_FOLD[c.c]; }

  CATS.forEach(function(c){ CAT_ON[c.c] = true; });

    g.items.forEach(function(it){ it.on = !it.na; it._userSet = false; });
  });

function scanTargets(){

    if(!catOn(c)) return;
    catGroups(c).forEach(function(n){
      const g = JUNK.find(function(x){ return x.g === n; });
      if(!g) return;
      g.items.forEach(function(it){ if(!it.na) out.push({g:n, it:it}); });
    });
  });
  return out;
}
function scannedItems(){
  const out = [];
  catList().forEach(function(c){
    catGroups(c).forEach(function(n){
      if(cleanScannedGroups.indexOf(n) < 0) return;
      const g = JUNK.find(function(x){ return x.g === n; });

    });

    + '<button class="btn sm" id="stopScan" style="margin-top:14px">取消扫描</button>'
    + '</div></div>';
}
/* ── 进度显示（2026-10-16 新增）────────────────────────────────────────
   扫描页和清理页共用一套"环 + 条 + 百分比"，一处改三处同步。
   ⚠️ 红线：这个函数**只写界面**，不碰任何扫描/清理的判断，
      也不回填任何数据 —— 界面上跑多少跟后端干了多少必须是两笔账。 */
function setProgress(pct, num){
  pct = Math.max(0, Math.min(100, Number(pct) || 0));
  const r = document.getElementById('progRing');
  if(r) r.style.setProperty('--p', pct.toFixed(1));
  const b = document.getElementById('progBar');
  if(b) b.style.width = pct.toFixed(1) + '%';
  const p = document.getElementById('progPct');
  if(p) p.textContent = Math.round(pct) + '%';
  const n = document.getElementById('progNum');
  if(n && num != null) n.textContent = num;
}
/* 扫描中局部刷新，不整页重绘（别打断进度动画） */
function setScanUI(name, found, done, total){
  const n = document.getElementById('scanNow'); if(n && name) n.textContent = name;
  const f = document.getElementById('scanFound'); if(f) f.textContent = fmtSize(found);
  /* 末段 8% 留给"去重统计"：逐项相加会把 deepjunk 与各日志项的重叠算两遍，
     后端还要再过一遍才出真实值。以前条子早就满了、界面还在转，看着就像卡死。 */
  if(total) setProgress(done / total * 92);
}
/* gname 是后端给的**小类名**，界面上按大类显示 → 先映射回大类再找元素 */
function markGroup(gname, bytes, running){
  const c = catOf(gname);
  const el = document.querySelector('[data-gst="'+(c ? c.c : gname)+'"]');
  if(!el) return;
  el.textContent = running ? '正在扫描垃圾…' : '✓ 找到 '+fmtSize(bytes||0);
  el.className = 'gs-st' + (running ? ' run' : ' ok');
  /* 整行一起提亮 + 挂脉冲点：原来 8 行长得一模一样，看不出在扫哪一类（2026-10-16） */
  const line = el.closest ? el.closest('.scan-line') : el.parentNode;
  if(line && line.classList) line.classList.toggle('run', !!running);
}

/* 「已经很干净了」的门槛（2026-10-13 用户定 50 MB）：
   真正能清掉的不到这个数，结果页就明确写"不用清"，主按钮也弱化成灰色。
   以前是甩一个几 MB 的数字给用户自己判断，用户只会觉得"怎么又有一堆"。 */
const CLEAN_ENOUGH = 50 * 1024 * 1024;

/* 结果页空态：这次一项都不该清（清不掉的已剔除、活缓存还没攒够）。
   2026-10-13 用户原话「90% 的用户只看最直观的结果」——
   与其甩一张空列表让人猜"是不是软件坏了"，不如直接给结论。 */
function renderCleanEmpty(){
  return ''
  + '<div class="card res-empty">'
  +   '<div class="re-ico">'+ico('check',28)+'</div>'
  +   '<div class="re-t">电脑很干净，没有要清的</div>'
  +   '<div class="re-d">该清的已经清掉了。程序还在跑，会慢慢再攒出缓存来；'
  +     '攒够了它自己会出现，现在不用管。</div>'
  +   '<div class="re-btns">'
  +     '<button class="btn" id="rescan">'+ico('refresh',15)+'重新扫描</button>'
  +     '<button class="btn primary" onclick="go(\'home\')">'+ico('home',16)+'返回首页</button>'
  +   '</div>'
  + '</div>';
}

/* ── 3/5 结果：已选中大数字 + 分组折叠（默认收起） ── */
function renderCleanResult(){
  const items = scannedItems();
  /* 一项都不该清（清不掉的已剔除、活缓存还没攒够）→ 给一个干脆的空态。
     别甩一张空列表加一句"直接删除无法恢复"，用户会以为软件坏了。 */
  if(!items.length) return renderCleanEmpty();
  const sum = sumSplit(items);
  const sel = items.filter(function(it){ return it.on; });
  const ssum = sumSplit(sel);
  /* 「已经很干净了」说的是**这台机器**的状态，所以用全部扫到的项来判（跟勾不勾无关）：
     用户全不选的时候不该告诉他"已经很干净了"，那是在替他做判断。 */
  const enough = sum.clean < CLEAN_ENOUGH;
  return ''
  + '<div class="card res-top">'
  +   '<div class="pick-ico">'+ico('trash',22)+'</div>'
  +   '<div class="res-sum">'
  /* 2026-10-14 用户要求「直接告诉我扫到多少、已选多少」：
     原来主数字写"这次真正能清掉 X"，下面再跟两段解释（会再长的缓存 / 不可恢复），
     三行字一起怼过来太啰嗦。现在只留两个数：扫到多少（这台机的实况，跟勾不勾无关）、
     已选多少（这一下点下去会动多少）。"直接删除无法恢复"挪到清理前的确认窗里说，
     那里才是用户做决定的地方。 */
  +     '<div class="res-main">扫到 <b data-scansize>'+fmtSize(sum.clean)+'</b> 垃圾'
  /* 结论就挂在主数字右边，不另起一块：另起一块会把说明文字挤成三行（实测 1220 宽下就挤了） */
  +       (enough ? '<span class="res-ok">'+ico('check',14)+'已经很干净了，现在不用清</span>' : '')
  +     '</div>'
  +     '<div class="res-sub">已选 <b data-selsize style="color:var(--info)">'+fmtSize(ssum.clean)+'</b>'
  +       ' · <b data-seln>'+sel.length+'</b> / '+items.length+' 项</div>'
  +   '</div>'
  +   '<div class="res-btns">'
  +     '<button class="btn sm" data-selall>全选</button>'
  +     '<button class="btn sm" data-selnone>全不选</button>'
  +     '<button class="btn" id="rescan">'+ico('refresh',15)+'重新扫描</button>'
  /* 没什么可清的时候主按钮要弱化：没事也亮着，用户会以为"还有事要做" */
  +     '<button class="btn'+(enough ? '' : ' primary')+'" data-doclean>'+ico('trash',16)+'一键清理</button>'
  +   '</div>'
  + '</div>'
  + catList().map(function(c,ci){
      /* 这一大类里，这次真正扫过的小类（没扫过就整类不显示） */
      const gs = catGroups(c).filter(function(n){ return cleanScannedGroups.indexOf(n) > -1; });
      if(!gs.length) return '';
      const live = catLive(c, gs);
      const gb = sumUnique(live);
      const onB = sumUnique(live.filter(function(it){ return it.on; }));
      const onN = live.filter(function(it){ return it.on; }).length;
      const fold = grpFold(c);
      const st = selState(onN, live.length);
      /* 与 pick 页同一套 .cat-card / .cat-h / .cat-sub —— 两页显示一致，只是这里多了体积 */
      return '<div class="card cat-card'+(st==='off'?' cat-off':'')+'">'
        + '<div class="cat-h" data-gt="'+ci+'">'
        +   '<span class="cat-ico">'+ico(c.ico||'box',18)+'</span>'
        /* 大类头的勾选框是三态的：点一下 = 没全选就全选 / 已全选就取消（半选时按全选处理） */
        +   '<div class="cbx '+st+'" data-gcbx="'+ci+'" title="'+c.c+'：全选 / 取消">'+cbxInner(st)+'</div>'
        +   '<div style="flex:1;min-width:0"><div class="cat-t">'+c.c+'</div>'
        /* 「共」也要有锚点（2026-10-14）：以前它是写死进 HTML 的，扫描后数据再更新时
           只有「已选中」会刷新，结果出现「已选中 252.5 MB > 共 252.2 MB」这种说不通的数。 */
        +     '<div class="cat-d">共 <span data-gb="'+ci+'">'+fmtSize(gb)+'</span>，已选中 '
        +       '<span class="gcount" data-gc="'+ci+'" style="color:var(--info)">'+fmtSize(onB)+'</span> · '
        +       '<span data-gn="'+ci+'">'+onN+'/'+live.length+'</span> 项</div></div>'
        +   '<button class="pick-open'+(!fold?' on':'')+'" data-gopen="'+ci+'">'
        +     '<span>'+(fold?'展开':'收起')+'</span>'
        +     '<span class="ni" style="display:inline-flex;transform:rotate('+(fold?'0':'90')+'deg)">'+ico('arrow',13)+'</span>'
        +   '</button>'
        + '</div>'
        + '<div class="cat-sub"'+(fold?' style="display:none"':'')+'>'
        +   live.map(function(it){
              /* 跨小类合并后，"组索引-项索引"不再唯一 → 用项自己的稳定编号 */
              /* 从清理前提醒点「返回检查」回来的项带 hl：高亮 + bind 时滚过去 */
              return '<div class="cat-i'+(CLEAN_HL[junkUid(it)]?' hl':'')+'">'
                + '<div class="cbx '+(it.on?'on':'')+'" data-cbx="u'+junkUid(it)+'">'+cbxInner(it.on?'on':'off')+'</div>'
                + '<div class="grow"><div class="row-t">'+it.n+' <span class="chip '+RISK[it.r].c+'">'+RISK[it.r].t+'</span>'
                +   (it.hv ? '<span class="chip warn">你的文件</span>' : '')+'</div>'
                + '<div class="row-d">'+it.d+'</div>'+deletableNote(it)+'</div>'
                + '<div class="size">'+itemSize(it)+'</div></div>';
            }).join('')
        + '</div></div>';
    }).join('')
  + '<div class="actbar">'
  /* 底部条跟顶部卡片同一个口径：只说「已选多少 · 勾了几项」。
     原来这里还拆了（缓存 / 你的文件 / 会再长）三个细分，和顶部那段一起看就是四行说明，太吵。
     单项的风险（"你的文件"橙色标）在列表里每行都有，这里不重复。 */
  +   '<div style="flex:1;font-size:13px;color:var(--tx2)">已选 <b data-selsize style="color:var(--info);font-variant-numeric:tabular-nums">'+fmtSize(ssum.clean)+'</b>'
  +     ' · <b data-seln>'+sel.length+'</b> / '+items.length+' 项</div>'
  +   '<button class="btn sm" data-selall>全选</button>'
  +   '<button class="btn sm" data-selnone>全不选</button>'
  +   '<button class="btn primary" data-doclean>'+ico('trash',16)+'一键清理</button>'
  + '</div>';
}

/* ── 4/5 清理中：沿用雷达动效，显示正在清理哪一项 ── */
function renderCleanRun(){
  const sel = scannedItems().filter(function(it){ return it.on; });
  const total = sumUnique(sel);
  /* wide：清理动画比扫描那圈更大一档（环、进度条与日志铺到 720px），
     原来 460px 的窄条在 940px 的内容区里看着很小气。
     scan-fill：卡片撑满整页（2026-10-16，跟完成页同一套），
     并靠日志区固定高度保证**清理过程中页面高度不再变化**（见样式区说明）。 */
  /* 2026-10-16 重做动效（跟扫描页同一套三件套：真实进度环 + 流动条纹 + 百分比）：
       环中央放"已处理 / 共几项"，比再放一遍百分比有信息量；
       日志改成"当前项脉冲点 → 干完变绿勾"，看得出正在动哪一项。
     ⚠️ 版面数字没动：日志仍是 8 行、仍是固定高度，页面在清理过程中**不会长高**。 */
  return '<div class="card scan-fill"><div class="scan-wrap wide">'
    + '<div class="scan-ring">'
    +   '<div class="ring-fill" id="progRing"></div><div class="ring-spin"></div>'

    +     '<div class="ring-num" id="progNum">0 / '+sel.length+'</div>'

    +   '</div>'
    + '</div>'
    + '<div class="scan-t">正在清理 <b style="color:var(--warn);font-variant-numeric:tabular-nums">'+fmtSize(total)+'</b> 垃圾</div>'
    + '<div class="scan-d">正在清理：<span id="cleanNow">准备中…</span></div>'
    + '<div class="bar-row" style="width:min(720px,100%)">'
    +   '<div class="bar"><i id="progBar" style="width:0%"></i></div>'

    + '</div>'

    + '</div></div>';
}
/* 新起一行 = 上一条已经干完了：脉冲点换成绿勾（2026-10-16）。
   ⚠️ 8 行上限和 CSS 里写死的 min-height 是一对，改一处必须改两处。 */
function pushCleanLine(name){
  const log = document.getElementById('cleanLog');
  if(!log || !name) return;
  const prev = log.lastElementChild;
  if(prev && prev.classList && prev.classList.contains('run')){
    prev.classList.remove('run');
    const dot = prev.querySelector('.cl-dot');
    if(dot) dot.outerHTML = '<span class="cl-dot ok">'+ico('check',12)+'</span>';
  }
  const d = document.createElement('div');
  d.className = 'scan-line run has-dot';
  d.innerHTML = '<span class="cl-dot"></span><b>'+escHome(name)+'</b>';
  log.appendChild(d);
  while(log.children.length > 8) log.removeChild(log.firstChild);
}
/* 全部干完：最后那条还是"正在动"的样子，收一下尾变成绿勾 */
function finishCleanLog(){
  const log = document.getElementById('cleanLog');
  if(!log) return;
  const prev = log.lastElementChild;
  if(prev && prev.classList && prev.classList.contains('run')){
    prev.classList.remove('run');
    const dot = prev.querySelector('.cl-dot');
    if(dot) dot.outerHTML = '<span class="cl-dot ok">'+ico('check',12)+'</span>';
  }
}
/* ── 5/5 完成：释放了多少 + 没清干净的提示 + 完成按钮 ── */
function renderCleanDone(){
  /* 差额说明（2026-10-10 用户要求）：扫到 500M 只清掉 450M 必须有交代，
     不然用户以为软件没干完活。这里一律用**复扫实测**的残留数，不编。 */
  /* 只把「真失败」的算进这里：被程序占用 / 判不出原因。
     活缓存重建(new)、已不在(gone) 不是失败，不拿它吓唬用户（2026-10-13）。 */
  const fl = failLeft();
  const hasLeft = fl.bytes > 1e6;
  const benign = benignLeft();
  const unverifiable = cleanLeftEst - cleanLeft > 5e6;   /* 差额明显大 → 有一部分没法逐个复核 */
  /* 有没有那排"重启后腾出 / 活缓存"小卡 —— 多处要用，算一次 */
  const showStats = !!(cleanRebootN || benign > 1e6);
  /* done-fill（2026-10-16 用户：「没占满页面！缩的太多了」）：
     .page 是 flex 列 + min-height:100%，给这张卡 flex:1 它才会顶满整页；
     里面再用 auto 外边距把内容竖直居中 —— 见样式区那段说明。 */
  return '<div class="card done-fill"><div class="done-wrap">'
    /* 居中 hero：大数字当主角（2026-10-15）—— 释放多少是用户最想知道的一件事，
       给它 34px，别再藏在句子里。 */
    + '<div class="done-hero2">'
    +   '<div class="done-badge">'+ico('check',26)+brandLogoHtml('bb-logo')+'</div>'
    +   '<div class="done-htxt">'
    +     '<div class="done-t2">清理完成</div>'
    +     '<div class="done-big">'+fmtSize(cleanFreed)+'<span class="done-bigsub">已释放</span></div>'
    +   '</div>'
    + '</div>'
    /* 其余两个数字各占一张小卡（2026-10-15）：「数字 + 短标题 + 一行说明」。
       2026-10-14 的口径红线不变：重启队列的这笔**现在还没腾出来**，绝不能并进主数字；
       活缓存同理 —— 三张卡三个身份，用户不会再把"还有 229.6 MB"误读成"没清完"。 */
    + (showStats
        ? '<div class="done-stats">'
          + (cleanRebootN
              ? '<div class="dst rb"><div class="dst-n">'+fmtSize(cleanRebootBytes)+'</div>'
                + '<div class="dst-t">重启后腾出</div>'
                + '<div class="dst-d">'+cleanRebootN+' 个文件被占用</div></div>'
              : '')
          + (benign > 1e6
              ? '<div class="dst new"><div class="dst-n">'+fmtSize(benign)+'</div>'
                + '<div class="dst-t">活缓存</div>'
                + '<div class="dst-d">程序会自动重建</div></div>'
              : '')
          + '</div>'
        : '')
    /* 2026-10-15：上面那张「下次开机自动删除」的蓝卡说完事情后，给一个**当场兑现**的出口。
       没有重启队列时整块不渲染（cleanRebootN 为 0）—— 没有这笔账就别劝人重启。 */
    + rbBlockHtml()
    /* 残留卡：数字给足字号，办法写在下面，入口是一个真按钮（不是夹在句子里的一截蓝字） */
    + (hasLeft
        ? '<div class="done-card warn">'
          + '<div class="dc-h"><span style="color:var(--warn)">'+ico('warn',15)+'</span>'
          +   '还有 <span class="dc-n">'+fmtSize(fl.bytes)+'</span> 没清掉'
          +   (fl.n ? '<span class="chip warn">'+fl.n+' 个文件</span>' : '')+'</div>'
          /* 两种残留说法完全不同（2026-10-13）：
             locked（程序占着）是可解的 → 教他怎么解；
             denied（系统保护）谁都删不掉 → 说清楚，并告诉他以后不会再列出来。 */
          + '<div class="dc-b">'
          +   (leftMainReason() === 'denied'
                ? '归系统自己管，任何清理软件都删不掉，<b>以后不再列出来</b>。'
                : '文件被程序占用。再清一次时勾上「关掉占着文件的程序」就能删。')
          + '</div>'
          + '<button class="dc-go" data-leftmore>看是哪些'+ico('arrow',13)+'</button>'
          + '</div>'
        /* 2026-10-15：上面那排小卡已经把"剩下的都是些什么"说完了，
           再补一句"其余垃圾已清干净"是同一件事说两遍，白占 44px 高度 ——
           有统计卡时干脆不出，只在没卡可看时才拿它收尾。
           （2026-10-13 的"活缓存要提前打招呼"原则不丢：那句话在小卡里。） */
        : (showStats
            ? ''
            : '<div class="done-card">'
              + '<div class="dc-h"><span style="color:var(--ok)">'+ico('check',15)+'</span>其余垃圾已清干净</div>'
              + '<div class="dc-b" style="margin-top:5px">程序再跑会写回新缓存，那是新产生的，不是没清掉。</div>'
              + '</div>'))
    + (unverifiable
        ? '<div class="done-note">另有约 '+fmtSize(cleanLeftEst - cleanLeft)
          + '（回收站等）按磁盘差值计算，未逐个复核。</div>'
        : '')
    /* 后台还在跑的项（2026-10-11 用户定）：其它项清完就出结果，让用户先走，
       但它必须交代清楚 —— 不然用户要么以为没清、要么看到系统弹窗以为出了事。 */
    + (cleanAsync.length
        ? '<div class="done-card async">'
          + '<div class="dc-h"><span style="color:var(--info)">'+ico('info',15)+'</span>'
          +   cleanAsync.join('、')
          +   '<span class="chip info"><i class="dc-pulse"></i>后台执行中</span></div>'
          + '<div class="done-list">'
          +   '<div class="done-li">其它项已清完，<b>可以直接返回，不用等</b>。</div>'
          +   '<div class="done-li">系统可能弹出进度窗口：<b>不用管、别关机</b>，跑完自己会关。</div>'
          + '</div></div>'
        : '')
    + '<div class="done-cta"><button class="btn primary lg" id="finishBtn">'+ico('check',16)+'完成</button></div>'
    + '</div></div>';
}
/* ── 「重启，把最后一批拿回来」区块（2026-10-15 新增，2026-10-16 定型）─────
   有排队删除（cleanRebootN>0）才出现 —— 没有这笔账就别劝人重启。
   **只剩「立即重启」一条路**（用户原话：「有了立即重启按钮之后，10 秒后重启
   简直就是画蛇添足，直接删掉」）。
   原来那套「缓冲 10 秒 + 倒计时 + 取消」连同 rbGo / rbTick / rbCancel / rbReset 一起
   **连根删掉**了，不是藏起来：缓冲的全部意义只是"手滑能反悔"，而那件事
   **确认框已经在做**，倒计时等于在同一个决定上问第二遍。
   ⚠️「不默默重启」这条底线没变，落点从倒计时挪到了**确认框** ——
      rbNow() 里那个 askThenDo 就是它，谁要删先看用户当天的原话。 */
function rbBlockHtml(){
  if(!cleanRebootN) return '';

/* 残留详情：按原因分组 + 说人话 + 告诉用户什么情况下才能清掉 */
function showLeftDetail(){
  const box = document.getElementById('modalBox');
  if(!box) return;
  const by = {};
  cleanLeftDetail.forEach(function(e){ (by[e.reason] = by[e.reason] || []).push(e); });
  const keys = LEFT_ORDER.filter(function(k){ return by[k] && by[k].length; });
  const sum = function(list){ return list.reduce(function(a,b){ return a + (b.bytes||0); }, 0); };
  const body = keys.length
    ? keys.map(function(k){
        const list = by[k], r = LEFT_REASON[k] || LEFT_REASON.other;
        const fail = !!LEFT_FAIL[k];

          + '<div style="font-size:13px;font-weight:640;display:flex;align-items:center;gap:8px">'+r.t

          /* 不是失败的要明说，否则用户会把活缓存当成"没清干净" */

          + '</div>'
          + '<div style="font-size:12px;color:var(--tx2);line-height:1.6;margin-top:3px">'+r.d+'</div>'

          +   (list.length > 12 ? '<br>…还有 '+(list.length-12)+' 个' : '')
          + '</div></div>';
      }).join('')
    : '<div style="font-size:12.5px;color:var(--tx2);line-height:1.7">这次没记录到具体的残留文件'
      + '（绝大多数是回收站、系统磁盘清理这类按磁盘差值计算的项，没有可逐个复核的文件清单）。'
      + '要是你觉得空间没回来，重新扫描一次看看 —— 数字是实测的。</div>';
  const fl = failLeft();
  box.style.width = 'min(620px,94vw)';

  box.innerHTML = '<div class="modal-t">'+ico('info',18)
    + (fl.bytes > 0 ? '还有 '+fmtSize(fl.bytes)+' 没清掉' : '没有真正清不掉的')+'</div>'
    + (fl.approx && fl.bytes > 0
        ? '<div style="font-size:11.5px;color:var(--tx3);margin:2px 0 8px">这次没有逐条原因，'
          + '以上按残留总数计，没有区分活缓存。</div>'
        : '')
    + '<div style="font-size:12.5px;color:var(--tx2);line-height:1.7;max-height:46vh;overflow:auto;padding:0 6px 6px 0">'+body+'</div>'
    + '<div class="modal-f"><button class="btn" id="leftClose">知道了</button>'
    + '<button class="btn primary" id="leftRescan">'+ico('refresh',15)+'重新扫描一次</button></div>';
  document.getElementById('modal').classList.add('open');
  document.getElementById('leftClose').onclick = closeModal;
  document.getElementById('leftRescan').onclick = function(){ closeModal(); beginScan(); };
}
/* 路径太长会把弹窗撑爆：只保留末尾几段（用户要认得是哪个文件夹） */
function shortPath(p){
  if(!p) return '';
  const s = String(p).replace(/\//g,'\\');
  const parts = s.split('\\');
  return parts.length > 4 ? '…\\' + parts.slice(-3).join('\\') : s;
}

/* ── 选中统计与局部刷新 ── */
function updateCleanSel(){
  const items = scannedItems();
  const sel = items.filter(function(it){ return it.on; });
  const s = sumSplit(sel);
  /* 「扫到」是这台机的实况，跟勾不勾无关 —— 全不选也还是这个数，所以取全量算 */
  const allSum = sumSplit(items);
  document.querySelectorAll('[data-scansize]').forEach(function(el){ el.textContent = fmtSize(allSum.clean); });
  document.querySelectorAll('[data-selsize]').forEach(function(el){ el.textContent = fmtSize(s.clean); });
  document.querySelectorAll('[data-safesize]').forEach(function(el){ el.textContent = fmtSize(s.safe); });
  document.querySelectorAll('[data-heavysize]').forEach(function(el){ el.textContent = fmtSize(s.heavy); });
  document.querySelectorAll('[data-renewsize]').forEach(function(el){ el.textContent = fmtSize(s.renew); });
  document.querySelectorAll('[data-seln]').forEach(function(el){ el.textContent = sel.length; });
  /* 没什么可清的时候主按钮弱化：没事也亮着，用户会以为"还有事要做" */
  document.querySelectorAll('[data-doclean]').forEach(function(el){
    el.className = 'btn' + (s.clean < CLEAN_ENOUGH ? '' : ' primary');
    el.innerHTML = ico('trash',16)+'一键清理'+(sel.length?'（'+sel.length+' 项）':'');
  });
  /* 大类头勾选框：三态跟随本类里勾了几项（全选 on / 部分 part / 零 off） */
  catList().forEach(function(c, ci){
    const live = catLive(c, cleanScannedGroups);
    if(!live.length) return;
    const onN = live.filter(function(it){ return it.on; }).length;
    const st = selState(onN, live.length);
    const box = document.querySelector('[data-gcbx="'+ci+'"]');
    if(box){
      box.className = 'cbx ' + st;
      box.innerHTML = cbxInner(st);
    }
    /* 与「已选中」同源刷新：两者都取当前 live，保证「共 ≥ 已选中」永远成立 */
    const gbEl = document.querySelector('[data-gb="'+ci+'"]');
    if(gbEl) gbEl.textContent = fmtSize(sumUnique(live));
    const gc = document.querySelector('[data-gc="'+ci+'"]');
    if(gc) gc.textContent = fmtSize(sumUnique(live.filter(function(it){ return it.on; })));
    const gn = document.querySelector('[data-gn="'+ci+'"]');
    if(gn) gn.textContent = onN + '/' + live.length;
  });
}

/* ── 扫描：真后端有事件流就走事件，浏览器直开走模拟 ── */
function beginScan(){
  /* 按**界面上看到的顺序**（大类顺序 → 大类内小类顺序）摊平成后端小类名。
     后端按传入顺序扫，所以扫描进度与选择顺序一致。 */
  const groups = [];
  catList().forEach(function(c){
    if(!catOn(c)) return;
    catGroups(c).forEach(function(n){ groups.push(n); });
  });
  if(inWails() && !catalogReady()){ toast('本机清理清单还没就绪，稍后再试','warn'); return; }
  if(!groups.length){ toast('至少选一类再开始扫描','warn'); return; }
  CLEAN_HL = {};            /* 新的一轮扫描，上一次"返回检查"的高亮不带过来 */
  cleanState = 'scanning'; render();
  if(hasGo()) scanWithGo(groups); else scanDemo(groups);
}
function scanWithGo(groups){
  const my = ++scanToken;
  const byId = {};
  JUNK.forEach(function(g){ g.items.forEach(function(it){ if(it.id) byId[it.id] = it; }); });
  const pool = scanTargets();
  let found = 0, files = 0, i = 0, lastG = null;
  const grpB = {};
  SCAN_CB = function(e){
    if(my !== scanToken) return;   /* 过期扫描的事件 */
    if(e.k === 'item'){
      const it = e.it || {}, t = byId[it.id];
      if(t) setItemScan(t, it.bytes, it.files, it.empty, it.paths, it);   /* 改数据即作废缓存 */
      const gname = it.group || '其他';
      if(lastG && lastG !== gname) markGroup(lastG, grpB[lastG], false);
      grpB[gname] = (grpB[gname] || 0) + (it.bytes || 0);
      lastG = gname; markGroup(gname, grpB[gname], true);
      i++; found += it.bytes || 0; files += it.files || 0;
      setScanUI(it.name, found, i, pool.length);
    } else {
      SCAN_CB = null;
      if(lastG) markGroup(lastG, grpB[lastG], false);
      setProgress(100);   /* 收尾那 8%（去重统计）跑完了，条子才准满 */
      /* 顶部那句"找到 X"用后端去重后的数：逐项相加会把 deepjunk 与各日志项的重叠算两遍 */
      setTimeout(function(){ finishScan(groups, (e && e.bytes) || found, (e && e.files) || files); }, 260);
    }
  };
  callGo('ScanJunk', groups).catch(function(err){
    SCAN_CB = null;
    junkBump();   /* 可能已经回填了一部分项，别让缓存留着上一轮的数 */
    cleanState = 'idle'; render();
    toast('扫描启动失败：'+err, 'danger');
  });
}
function scanDemo(groups){
  const pool = scanTargets();
  let i = 0, size = 0, lastG = null;
  const grpB = {};
  const per = Math.max(1, Math.ceil(pool.length / 26));
  const t = setInterval(function(){
    if(i < pool.length){
      const cur = pool[i];
      if(lastG && lastG !== cur.g) markGroup(lastG, grpB[lastG], false);
      const end = Math.min(pool.length, i + per);
      for(; i < end; i++){ size += pool[i].it.s; grpB[pool[i].g] = (grpB[pool[i].g] || 0) + pool[i].it.s; }
      lastG = cur.g; markGroup(cur.g, grpB[cur.g], true);
      setScanUI(cur.it.n, size, i, pool.length);
    } else {
      clearInterval(t);
      if(lastG) markGroup(lastG, grpB[lastG], false);
      setProgress(100);   /* 收尾那 8%（去重统计）跑完了，条子才准满 */
      setTimeout(function(){ finishScan(groups, size, 0); }, 260);
    }
  }, 240);
  window.__scanTimer = t;
}
/* 扫描收尾：扫到什么就默认勾什么（与扫描范围一一对应） */
function finishScan(groups, found, files){
  junkBump();            /* 每项的路径清单刚被换成真实扫描结果，旧缓存全部作废 */
  cleanScannedGroups = groups;
  setJunkScanResult(groups);   /* 真实体积落到首页：扫完才出健康分 */
  JUNK.forEach(function(g){
    const hit = groups.indexOf(g.g) > -1;
    g.items.forEach(function(it){
      /* 扫描前用户手动勾过的项**保留他的选择**，没动过的才默认全选。
         否则他在 pick 页取消了"回收站"，扫完又自动勾回去 —— 那就白选了。 */
      it.on = hit && !it.na && (it._userSet ? it.on : true);
    });
  });
  CATS.forEach(function(c){ GRP_FOLD[c.c] = true; });   /* 结果页默认收起 */
  cleanState = 'done';
  render();
  /* 报"能清掉多少"，不报"扫到多少"（2026-10-13）：
     扫到的总数里含"程序正在用、清完就写回"的那部分，报它只会让人觉得清不干净。 */
  const sp = sumSplit(scannedItems());
  toast(sp.clean > 0 ? ('扫描完成，能清掉 ' + fmtSize(sp.clean)) : '扫描完成，已经很干净了', 'ok');
  /* 后台预热占用者探测（2026-10-14）：whoLocks 抽 112 条路径走 Restart Manager 要 5~9 秒，
     等用户点「一键清理」再算就是当着他面干等 —— 他只会以为按钮坏了。
     扫完就把默认勾选项的探测跑起来，点下去时命中缓存，弹窗立刻出来。 */
  prefetchLockers();
}

/* 预热：不阻塞、不提示，失败也无所谓（点的时候会重算一次） */
let prefetchKey = '';
function prefetchLockers(){
  if(!hasGo()) return;
  const ids = scannedItems().filter(function(it){ return it.on; })
                .map(function(it){ return it.id; }).filter(Boolean).sort();
  if(!ids.length) return;
  const k = ids.join('|');
  if(k === prefetchKey) return;      /* 同一份结果别反复打扰后端 */
  prefetchKey = k;
  callGo('JunkWhoLocks', ids).then(function(){}, function(){});
}

/* ── 清理 ── */
function runClean(sel){
  const ids = sel.map(function(it){ return it.id; }).filter(Boolean);
  if(hasGo() && ids.length === sel.length){ cleanWithGo(sel, ids); return; }
  /* 壳里绝不允许走演示清理：那会伪造"已释放 X GB"，其实一个文件都没删 */
  if(inWails()){ toast('未连上后端，已拒绝执行清理','danger'); return; }
  cleanDemo(sel);
}
/* ── 占用进程那一段的拼装（2026-10-13）：只负责画行、收 PID，
      弹窗统一由 openCleanConfirm 开 —— 三件事合成一个窗，用户只被打断一次 ── */
/* 一个应用可能有好几个进程（实测钉钉 8 个），pids 一起带上，关的时候全关 */
function lkPidsOf(l){ return (l.pids && l.pids.length ? l.pids : [l.pid]).filter(function(n){ return n > 0; }); }
function lkRow(l){
  const on = !l.protect;
  const h = lkHuman(l);
  const nm = (h && h.n) || l.name || ('PID ' + l.pid);
  /* 后果说明：受保护的照播后端给的原因，能关的说"关掉会怎样"——
     这才是用户决定勾不勾的依据，只给进程名等于让他瞎猜。 */
  const tip = l.protect ? (l.why || '不允许关闭')
            : ((h && h.t) ? h.t : LK_TIP_FALLBACK);
  return '<label class="lk-row' + (on ? '' : ' lk-off') + '">'
    + (on
        ? '<input type="checkbox" class="lk-cb" data-pids="' + lkPidsOf(l).join(',') + '">'
        : '<span class="lk-lock">' + ico('shield', 14) + '</span>')
    + '<span class="lk-name">' + escHome(nm) + '</span>'
    + (l.exe && l.exe !== nm ? '<span class="lk-exe">' + escHome(l.exe) + '</span>' : '')
    + '<span class="lk-n">' + (l.files || 0) + ' 个文件</span>'
    + '<span class="lk-why' + (on ? (h && h.k === 'auto' ? ' lk-why-dim' : '') : ' lk-why-dim') + '">'
    +   escHome(tip) + '</span>'
    + '</label>';
}
/* 勾了哪些进程：一个应用带好几个 pid，勾一下就是它全部进程 */
function lkCheckedPids(box){
  const pids = [];
  [].slice.call((box || document).querySelectorAll('.lk-cb')).forEach(function(cb){
    if(!cb.checked) return;
    String(cb.getAttribute('data-pids') || '').split(',').forEach(function(s){
      const n = parseInt(s, 10);
      if(!isNaN(n) && n > 0) pids.push(n);
    });
  });
  return pids;
}
function cleanWithGo(sel, ids){
  cleanState = 'cleaning'; render();
  CLEAN_LAST = null;
  CLEAN_CB = function(e){
    const now = document.getElementById('cleanNow');
    if(e.name && now) now.textContent = e.name;
    if(e.total){
      const d = Math.min(e.done || 0, e.total);
      /* 末段 10% 单独留给"复核残留"：项全删完之后后端还要逐个回看有没有漏网的，
         这段时间条子不动、环还在转 —— 以前看着就像卡死，现在明说是哪一步。 */
      const pct = d >= e.total ? 90 : d / e.total * 90;
      setProgress(pct, d + ' / ' + e.total);
      if(d >= e.total && now) now.textContent = '正在复核残留…';
      /* 记下后端推到哪一步了：结果回不来的时候靠它判断"活干完了没"，
         否则一句「清理失败」会让用户以为白清了（其实文件已经删掉）。
         ⚠️ 这里存的是**后端原始数据**，跟上面那个给界面看的 pct 是两笔账，别混。 */
      CLEAN_LAST = { done: e.done || 0, total: e.total };
    }
    if(e.name) pushCleanLine(e.name);
  };
  callGo('CleanJunkSafe', ids).then(function(res){
    CLEAN_CB = null;
    let freed = 0, failed = 0, left = 0, leftN = 0, detail = [], async = [];
    (res || []).forEach(function(r){
      freed += r.bytes || 0; failed += r.failed || 0;
      cleanRebootN += r.reboot || 0; cleanRebootBytes += r.rebootBytes || 0;
      /* 后台项：Bytes=0 是"还没跑完"，不是"没清掉" —— 记下名字，完成页要告诉用户它还在跑 */
      if(r.async) async.push(r.name || '系统磁盘清理');
      /* 残留用后端复扫实测值（leftBytes/leftFiles/leftDetail），不再拿"选中量 − 已释放"估算 ——
         那个差额里混着"没删掉的"和"命令型项按磁盘差值倒推的"，说不清是哪几个文件。 */
      left += r.leftBytes || 0; leftN += r.leftFiles || 0;
      if(r.leftDetail && r.leftDetail.length) detail = detail.concat(r.leftDetail);
    });
    cleanFreed = freed;
    cleanLeftN = leftN || failed;          /* 有实测文件数就用实测，没有（不可复核项）才退回后端报的失败数 */
    cleanLeft = left;
    cleanLeftDetail = detail;
    cleanAsync = async;
    cleanLeftEst = Math.max(0, sumUnique(sel) - freed);
    junkBump();            /* 真删过文件了，缓存里的体积不再是这台机的实况 */
    try{ callGo('DebugLog', 'clean ok: freed=' + freed + ' left=' + left + ' detail=' + detail.length); }catch(e){}
    cleanState = 'finished'; render();
  }).catch(function(err){
    CLEAN_CB = null;
    junkBump();            /* 清理是逐项删的，失败也可能已经删掉一部分 */
    /* 这句必须写日志：界面上只显示一次就消失，下次再失败还是查不到原因 */
    try{ callGo('DebugLog', 'clean fail: ' + (err && err.message ? err.message : err)
      + ' | progress=' + (CLEAN_LAST ? (CLEAN_LAST.done + '/' + CLEAN_LAST.total) : 'none')); }catch(e){}
    /* 后端推到 90% 以上就当作"活干完了" —— 最后几项常常只是复核残留，卡的是回传不是清理。
       超时也不许写成"清理失败"：那会让用户以为白清了（文件其实已经删掉）。 */
    const ranAll = CLEAN_LAST && CLEAN_LAST.total > 0 && CLEAN_LAST.done >= CLEAN_LAST.total * 0.9;
    const isTimeout = /超时/.test(err && err.message ? err.message : String(err));
    toast(ranAll || isTimeout
      ? '清理已经跑完了，但结果没取回来（重新扫描一次就能看到实际释放了多少）'
      : ('清理失败：' + (err && err.message ? err.message : err)), 'warn');
    cleanState = 'done'; render();
  });
}
function cleanDemo(sel){
  const total = sumUnique(sel);
  cleanState = 'cleaning'; render();
  let i = 0;
  const t = setInterval(function(){
    if(i < sel.length){
      const it = sel[i];
      const now = document.getElementById('cleanNow'); if(now) now.textContent = it.n;
      setProgress(i / sel.length * 90, i + ' / ' + sel.length);
      pushCleanLine(it.n);
      i++;
    } else {
      clearInterval(t);
      /* 预览也照真机口径走：删完还有一段"复核残留"，条子不一步跳到 100% */
      const now = document.getElementById('cleanNow'); if(now) now.textContent = '正在复核残留…';
      setProgress(90, sel.length + ' / ' + sel.length);
      setTimeout(function(){
        finishCleanLog();
        junkBump();          /* 演示清理也算"这一轮结束了"，数字不该再吃缓存 */
        cleanFreed = Math.round(total * 0.97);
        cleanLeft = total - cleanFreed;
        cleanLeftEst = cleanLeft;
        cleanLeftN = Math.round(sel.length * 0.06);
        cleanLeftDetail = [];   /* 浏览器预览没有真文件，原因清单是空的 —— 详情弹窗会如实说明 */
        /* 预览里也照真机口径走：勾了后台项就要显示"它还在跑"那块，不然设计稿看不出来 */
        cleanAsync = sel.filter(function(it){ return /cleanmgr|磁盘清理/.test(it.n || ''); })
                        .map(function(it){ return it.n; });
        cleanState = 'finished'; render();
      }, 480);
    }
  }, 320);
}

function bindClean(){
  /* 整行点一下 = 这一类全选 / 整类取消（细项跟着一起变） */
  document.querySelectorAll('[data-pick]').forEach(function(r){
    r.addEventListener('click', function(){
      const c = catList()[+r.dataset.pick];
      if(!c) return;
      const live = catLive(c);
      const allOn = live.length > 0 && live.every(function(it){ return it.on; });
      live.forEach(function(it){ it.on = !allOn; it._userSet = true; });
      updatePickSel();
    });
  });
  /* 明细里逐项勾选：这就是"部分选中"的来源 */
  document.querySelectorAll('[data-pickitem]').forEach(function(r){
    r.addEventListener('click', function(){
      const it = junkByU(+r.dataset.pickitem.slice(1));
      if(!it) return;
      it.on = !it.on;
      it._userSet = true;
      updatePickSel();
    });
  });
  document.querySelectorAll('[data-catopen]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();          /* 别让整行的勾选跟着切 */
      const c = catList()[+b.dataset.catopen];
      if(!c) return;
      CAT_OPEN[c.c] = !catOpen(c);
      render();
    });
  });
  const pa = document.getElementById('pickAll');
  if(pa) pa.addEventListener('click', function(){
    JUNK.forEach(function(g){ g.items.forEach(function(it){ it.on = !it.na; it._userSet = false; }); });
    CATS.forEach(function(c){ CAT_ON[c.c] = true; });
    render();
  });
  const pn = document.getElementById('pickNone');
  if(pn) pn.addEventListener('click', function(){
    JUNK.forEach(function(g){ g.items.forEach(function(it){ it.on = false; it._userSet = true; }); });
    CATS.forEach(function(c){ CAT_ON[c.c] = false; });
    render();
  });
  const pr = document.getElementById('pickReset');
  if(pr) pr.addEventListener('click', function(){ resetCleanSel(); render(); });

  const s = document.getElementById('startScan');
  if(s) s.addEventListener('click', function(){
    if(!catList().some(catOn)){ toast('至少选一类再开始扫描','warn'); return; }
    beginScan();
  });
  const stop = document.getElementById('stopScan');
  if(stop) stop.addEventListener('click', function(){
    if(window.__scanTimer) clearInterval(window.__scanTimer);
    if(hasGo()) callGo('StopScan');
    scanToken++;            /* 作废本轮扫描还在飞的事件 */
    SCAN_CB = null;
    cleanState = 'idle'; render();
  });

  const rs = document.getElementById('rescan');
  if(rs) rs.addEventListener('click', function(){ cleanState = 'idle'; render(); });
  /* 清单没就绪页的"重新读取" */
  const cr = document.getElementById('catRetry');
  if(cr) cr.addEventListener('click', function(){ loadCatalog(); render(); });

  /* 结果页：全选 / 全不选（顶部与底部两处按钮，同一套逻辑） */
  document.querySelectorAll('[data-selall]').forEach(function(b){
    b.addEventListener('click', function(){
      scannedItems().forEach(function(it){ it.on = true; });
      document.querySelectorAll('[data-cbx]').forEach(function(c){ setCbx(c, 'on'); });
      updateCleanSel();
    });
  });
  document.querySelectorAll('[data-selnone]').forEach(function(b){
    b.addEventListener('click', function(){
      scannedItems().forEach(function(it){ it.on = false; });
      document.querySelectorAll('[data-cbx]').forEach(function(c){ setCbx(c, 'off'); });
      updateCleanSel();
    });
  });
  /* 行勾选：只改数据 + 局部刷新，不整页重绘。
     编号是项自己的稳定 id（跨小类合并后不再依赖"第几组第几项"） */
  document.querySelectorAll('[data-cbx]').forEach(function(c){
    c.addEventListener('click', function(){
      const it = junkByU(+c.dataset.cbx.slice(1));
      if(!it) return;
      it.on = !it.on;
      setCbx(c, it.on ? 'on' : 'off');
      clearHl();          /* 用户已经动手勾了，高亮提示就该退场 */
      updateCleanSel();
    });
  });
  /* 完成页「看是哪些、怎么才能清掉」 */
  const lm = document.querySelector('[data-leftmore]');
  if(lm) lm.addEventListener('click', showLeftDetail);
  /* 完成页「立即重启」（2026-10-15 加，2026-10-16 起只剩这一个）：
     这块每次重绘都是新节点，必须跟着一起绑 —— 跟 data-leftmore 一个道理。
     直接传 rbNow 就行：它不吃参数，弹不弹确认框由它自己决定。 */
  const rbNowBtn = document.querySelector('[data-rbnow]');
  if(rbNowBtn) rbNowBtn.addEventListener('click', rbNow);
  /* 大类头勾选框（三态）：没全选 → 全选；已全选（或半选）→ 整类取消。
     要点在 .cat-h 上还有"点一下展开/收起"，所以这里必须拦住冒泡。 */
  document.querySelectorAll('[data-gcbx]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      const c = catList()[+b.dataset.gcbx];
      if(!c) return;
      const live = catLive(c, cleanScannedGroups);
      if(!live.length) return;
      const allOn = live.every(function(it){ return it.on; });
      live.forEach(function(it){
        it.on = !allOn;
        const box = document.querySelector('[data-cbx="u'+junkUid(it)+'"]');
        if(box) setCbx(box, it.on ? 'on' : 'off');
      });
      updateCleanSel();
    });
  });
  /* 组展开 / 收起（默认收起）：整行与右侧按钮是同一动作，按钮要点名拦冒泡。
     走 render() 而不是就地切 class —— 按钮上的「展开 / 收起」文案得跟着换。 */
  const toggleCatFold = function(ci){
    const c = catList()[ci];
    if(!c) return;
    GRP_FOLD[c.c] = !grpFold(c);
    render();
  };
  document.querySelectorAll('[data-gt]').forEach(function(h){
    h.addEventListener('click', function(){ toggleCatFold(+h.dataset.gt); });
  });
  document.querySelectorAll('[data-gopen]').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation(); toggleCatFold(+b.dataset.gopen); });
  });
  document.querySelectorAll('[data-doclean]').forEach(function(b){
    b.addEventListener('click', function(){
      const sel = scannedItems().filter(function(it){ return it.on; });
      if(!sel.length){ toast('还没勾选要清理的项目','warn'); return; }
      cleanStart(sel);
    });
  });
  /* 完成按钮：回首页 + 体检分实时刷新（液球涨到新分数） */
  const fin = document.getElementById('finishBtn');
  if(fin) fin.addEventListener('click', function(){
    const from = SCORE;
    /* 剩余垃圾 = 扫到的 − 这次真删掉的（cleanFreed 是后端逐个文件报回的真实删除量，
       失败的文件不算进去）。不重新扫一遍也能给出准确数，不编造。 */
    const prevJunk = lastJunkBytes();
    if(prevJunk !== null){
      const left = Math.max(0, prevJunk - cleanFreed);
      lastScan = left > 0 ? [{bytes:left}] : [];
    }
    recomputeHome(); const to = SCORE;
    cleanState = 'idle';
    resetCleanSel();
    cleanScannedGroups = [];
    go('home');
    toast('清理完成，健康分 ' + (to - from >= 0 ? '+' : '') + (to - from) + '（' + from + ' → ' + to + '）', 'ok');
  });
}

/* 设置页状态（2026-10-13 重做）。
   ⚠️ 每一项都必须有「没读到」的表达（null → 界面写「读取中…」/「未获取到」），
   不许拿 false / 0 顶 —— 读失败被显示成「未开启」，用户会去关一个本来就没开的东西。 */
let SET = {autoStart:null, hash:'', elev:null, caps:null, pending:null, ver:'', build:'', about:null};
/* 「最近改动」默认收起（2026-10-13）：它是日志不是设置，摊开会把整页顶出屏幕。
   收起时仍给一条最新记录（只留「什么时候 + 干了什么」，明细展开看）。 */
let SETLOG_OPEN = false;
let OPLOG = [], oplogState = 'loading';
function loadOpLog(){
  if(!hasGo()){ oplogState = 'demo'; return; }
  oplogState = 'loading';
  callGo('GetOpLog').then(function(l){ OPLOG = l || []; oplogState = 'ready'; window.SetPanel.refresh(); })
    .catch(function(){ oplogState = 'failed'; window.SetPanel.refresh(); });
}
function loadSettings(){
  if(!hasGo()) return;
  callGo('GetAutoStart').then(function(on){ SET.autoStart = !!on; window.SetPanel.refresh(); }).catch(function(){});
  callGo('GetSelfHash').then(function(h){ SET.hash = h || ''; window.SetPanel.refresh(); }).catch(function(){});
  /* 运行权限 / 能力数量 / 待重启：都是只读状态，读不到就写「未获取到」，不编 */
  callGo('IsElevated').then(function(v){ SET.elev = !!v; window.SetPanel.refresh(); }).catch(function(){});
  callGo('GetCapabilityStats').then(function(c){ SET.caps = c || null; window.SetPanel.refresh(); }).catch(function(){});
  callGo('GetPendingReboot').then(function(p){ SET.pending = (p && p.n > 0) ? p : null; window.SetPanel.refresh(); }).catch(function(){});
  callGo('GetAboutInfo').then(function(i){
    SET.ver = (i && i.version) || ''; SET.build = (i && i.buildDate) || '';
    /* 关于 / 反馈两个面板吃同一份数据（官网、Bug 入口、QQ 群、微信）——
       存下来，免得反馈面板再去拉一次（拉两次就是两套可能不一致的数据） */
    SET.about = i || null;
    window.SetPanel.refresh();
  }).catch(function(){});
  loadOpLog();
}
function opSuIdByName(name){
  let out = '';
  (SU || []).forEach(function(it){ if(!out && (it.name === name || it.n === name)) out = it.id; });
  return out;
}
function opUndoStartup(ts){
  const e = OPLOG.filter(function(x){ return x.ts === ts; })[0];
  if(!e) return;
  const ids = (e.items || []).map(opSuIdByName).filter(function(x){ return !!x; });
  if(!ids.length){ toast('这条记录里的项在当前启动项清单里找不到，无法还原', 'warn'); return; }
  const doIt = function(){
    let done = 0;
    const step = function(k){
      if(k >= ids.length){ toast('已开回 ' + done + ' 个自启项', 'ok'); loadOpLog(); if(window.suLoad) window.suLoad(); return; }
      callGo('SetStartupEnable', ids[k], true).then(function(msg){ if(!msg) done++; step(k + 1); }).catch(function(){ step(k + 1); });
    };
    step(0);
  };
  /* 2026-10-13：改用通用确认框 —— 它自己那套会直接覆盖 #modalBox，
     而设置页现在是弹窗（同一个容器），两套并存的话点一下设置窗就被吃掉了。 */
  askThenDo('把这次动过的启动项开回来？',
    escHome(e.ts)+' · '+escHome(e.title || '')
    + '<div style="margin-top:10px;font-size:12.5px;line-height:1.85">'
    +   '<b>会发生什么</b>：重新启用 ' + ids.length + ' 个开机自启项<br>'
    +   '<b>影响面多大</b>：只动这些，其它设置不变<br>'
    +   '<b>怎么撤回</b>：还原本身也会记进操作日志，随时能再关掉'
    + '</div>',
    '开回来', doIt);
}
/* 通用确认框（2026-10-13）：设置页那几个"点下去会丢东西"的按钮都走它。
   项目弹窗机制 = #modal + #modalBox.innerHTML + .open / closeModal()。
   弹不出来（元素不在）就直接执行 —— 不能让一个还没就位的弹窗把功能卡死。 */
function askThenDo(title, body, okText, fn){
  const box = document.getElementById('modalBox'), modal = document.getElementById('modal');
  if(!box || !modal){ fn(); return; }
  let done = false;
  /* 设置现在是弹窗（2026-10-13）：确认框会占用同一个 #modalBox，
     所以要先记住"背后那个是不是设置窗"，关掉后再把它画回来 ——
     不然问一句「重置吗」，设置窗就被吃掉了，用户还得重新点齿轮。 */
  const backToSettings = !!window.SetPanel.isOpen();
  if(backToSettings) SET_ASKING = true;   /* 问话期间不许重画设置窗（见 paintSettings 里的说明） */
  const dismiss = function(){
    SET_ASKING = false;
    if(backToSettings){
      window.SetPanel.refresh();
      modal.classList.add('open');
    } else {
      closeModal();
    }
  };
  const go = function(){ if(done) return; done = true; dismiss(); fn(); };
  box.classList.remove('setbox');
  box.style.width = 'min(470px,94vw)';
  box.innerHTML = '<div class="modal-t">'+title+'</div>'
    + '<div class="modal-d" style="line-height:1.8">'+body+'</div>'
    + '<div class="modal-f"><button class="btn" id="askNo">取消</button>'
    + '<button class="btn primary" id="askYes">'+ico('check',15)+okText+'</button></div>';
  modal.classList.add('open');
  document.getElementById('askNo').onclick = function(){ if(done) return; done = true; dismiss(); };
  document.getElementById('askYes').onclick = go;
}

/* ════════ 软件更新 / 官方原版校验（2026-10-13 新增）════════
   用户拍板：更新方式 = 软件内下载 + 校验 + 自动替换自身并重启；
             校验范围 = 当前跑的 exe + 下载下来的包，两个都校验；
             检查时机 = 启动静默查一次（有新版才在齿轮上点个小点）+ 设置里可手动查。
   状态机都在下面这两个对象里，渲染只读它们，不猜。 */
let UPD = {state:'idle', info:null, prog:null, msg:'', at:''};
let VER = {state:'idle', r:null, msg:''};
let SET_OPEN = false;

function setBusy(on){ UPD.busy = !!on; }

/* 更新那一块。state 的每一种都对应一句人话 ——
   ⚠️ 拉不到清单必须写「没查到 + 原因」，绝不能写成「已是最新」（那是把没读到演成没问题）。 */
function updHtml(){
  const s = UPD.state, info = UPD.info || {};
  const btn = function(id, txt, cls){ return '<button class="btn sm'+(cls ? ' ' + cls : '')+'" id="'+id+'">'+txt+'</button>'; };
  let line = '', tail = '';

  if(s === 'idle'){
    line = '<span class="upd-line" style="color:var(--tx3)">还没查过</span>';
    tail = btn('setUpdCheck', '检查更新');
  } else if(s === 'checking'){
    line = '<span class="upd-line" style="color:var(--tx3)">正在连更新服务器…</span>';
    tail = '<button class="btn sm" disabled>检查中</button>';
  } else if(s === 'dev'){
    line = '<span class="upd-line" style="color:var(--tx3)">开发版不检查更新</span>';
    tail = btn('setUpdCheck', '再查一次');
  } else if(s === 'new'){
    line = '<span class="upd-line upd-new">有新版本 '+verLabel(info.latest||'')+'</span>';
    const notes = (info.notes && info.notes.length)
      ? '<ul class="upd-notes">'+info.notes.map(function(n){ return '<li>'+escHome(n)+'</li>'; }).join('')+'</ul>'
      : '';
    line += '<div class="upd-box">'
      + '<div style="font-size:12.5px">现在是 <b>'+verLabel(info.current||SET.ver||'')+'</b>，服务器上是 <b>'+verLabel(info.latest||'')+'</b>'
      +   (info.size ? '（约 '+fmtSize(info.size)+'）' : '') + '</div>'
      + notes
      + (info.buildDate ? '<div class="upd-meta">发布于 '+escHome(info.buildDate)+'</div>' : '')
      + '<div class="btn-row" style="margin-top:10px">'
      +   '<button class="btn sm" id="setUpdGo">'+ico('bolt',14)+'下载并更新</button>'
      +   '<button class="btn sm" id="setUpdCheck">再查一次</button>'
      + '</div>'
      + '</div>';
    /* 按钮都在上面那个盒子里，右侧不再放 —— 免得同一屏出现两个"下载"入口 */
  } else if(s === 'latest'){
    line = '<span class="upd-line upd-ok">已是最新版本 '+verLabel(info.latest||SET.ver||'')+'</span>';
    tail = btn('setUpdCheck', '再查一次');
  } else if(s === 'downloading'){
    const p = UPD.prog || {done:0, total:0};
    const pct = p.total ? Math.min(100, Math.round(p.done / p.total * 100)) : 0;
    line = '<span class="upd-line" style="color:var(--tx3)">正在下载 '+verLabel((UPD.info||{}).latest||'')+'…</span>';
    line += '<div class="upd-bar"><i id="updBarFill" style="width:'+pct+'%"></i></div>'
      + '<div class="upd-meta" id="updMeta">' + fmtSize(p.done) + (p.total ? (' / ' + fmtSize(p.total) + ' · ' + pct + '%') : '') + '</div>';
    tail = '<button class="btn sm" disabled>下载中</button>';
  } else if(s === 'ready'){
    line = '<span class="upd-line upd-ok">更新包已下好，指纹对得上</span>';
    tail = btn('setUpdApply', '替换并重启', 'primary');
  } else if(s === 'applying'){
    line = '<span class="upd-line" style="color:var(--tx3)">正在替换，软件马上会自己重开…</span>';
    tail = '<button class="btn sm" disabled>替换中</button>';
  } else {  /* offline / badmanifest / fail：一律把原因写出来 */
    line = '<span class="upd-line upd-bad">'+(s === 'offline' ? '没查到更新信息' : '检查没成功')+'</span>'
      + '<div class="upd-meta" style="color:var(--tx3);white-space:normal">'+escHome(UPD.msg || info.message || '未知原因')+'</div>';
    tail = btn('setUpdCheck', '重试');
  }

  return '<div class="set-row" style="display:block">'
    + '<div style="display:flex;align-items:center;gap:16px">'
    +   '<div class="set-l"><div class="set-l-t">检查更新</div>'
    +   '<div class="set-l-d">'+(UPD.at ? ('上次检查 '+escHome(UPD.at)) : '从 opt.3z9w.com 取最新版本')+'</div></div>'
    +   '<div class="set-a">'+tail+'</div>'
    + '</div>'
    + (line ? '<div style="margin-top:2px">'+line+'</div>' : '')
    + '</div>';
}

/* 校验结果那一条。四种结局各有各的说法，尤其"服务器没记录"绝不能写成"校验不通过"。 */
function vfHtml(){
  const s = VER.state, r = VER.r || {};
  if(s === 'idle') return '';
  if(s === 'busy') return '<div class="vf-res">正在核对…</div>';
  if(s === 'fail') return '<div class="vf-res bad">'+ico('warn',13)+' '+escHome(VER.msg || '核对没成功')+'</div>';
  let cls = '', pre = '';
  if(r.state === 'ok'){ cls = ' ok'; pre = ico('check',13)+' '; }
  else if(r.state === 'mismatch'){ cls = ' bad'; pre = ico('warn',13)+' '; }
  else { cls = ''; pre = ''; }
  return '<div class="vf-res'+cls+'">'+pre+escHome(r.message || '')+'</div>';
}

function fmtSize(n){
  n = Number(n) || 0;
  if(n <= 0) return '—';
  const u = ['B','KB','MB','GB'];
  let f = n, i = 0;
  while(f >= 1024 && i < u.length - 1){ f /= 1024; i++; }
  return (i === 0 ? n + ' B' : f.toFixed(1) + ' ' + u[i]);
}

/* 手动 / 启动时都走这一个 —— 两条路径的判定完全一致，不写两份 */
function checkUpdate(silent){
  if(UPD.busy) return;
  setBusy(true);
  UPD.state = 'checking';
  UPD.msg = '';
  if(!silent && SET_OPEN) window.SetPanel.refresh();
  callGo('CheckUpdate').then(function(r){
    r = r || {};
    UPD.info = r;
    UPD.at = r.checkedAt || '';
    if(r.state === 'new'){
      UPD.state = 'new';
      const b = document.getElementById('tbSet');
      if(b) b.classList.add('has-dot');    /* 齿轮上点个小点，不弹窗不打断 */
    } else if(r.state === 'latest'){
      UPD.state = 'latest';
      const b = document.getElementById('tbSet');
      if(b) b.classList.remove('has-dot');

      UPD.state = r.state || 'offline';

    if(SET_OPEN) window.SetPanel.refresh();
  }).catch(function(e){
    UPD.state = 'offline';
    UPD.msg = '调用后端失败：' + e;
    UPD.busy = false;
    if(SET_OPEN) window.SetPanel.refresh();
