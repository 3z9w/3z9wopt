; ============================================================================
; 3z9wOpt 垃圾清理规则文件（2026-11-12 规则引擎化）
;
; 覆盖三类：浏览器缓存 / 应用缓存 / AI 应用缓存（共 51 项，自 junk_items.go 迁入）。
; 引擎（junkrules.go）只认「路径 + 通配符」：
;   - 无命令执行、无注册表删除、无网络访问 —— 规则是数据不是代码；
;   - 加新软件 = 照抄一节改路径；引擎与既有清理行为不受影响。
;
; 用法：
;   ① 官方名单：本文件随程序编译内置（go:embed），随版本更新。
;   ② 自定义规则：在 exe 同目录放 custom.ini，格式与本文件完全相同。
;      - ID（节名 [xxx]）与内置相同的 = 覆盖官方规则（改路径/改文案）；
;      - ID 是新的 = 追加新项，自动从「其他应用缓存（自动发现）」里排除、不双算。
;      写错了只是那一条不生效（启动时会跳过并记日志），不影响其他项。
;
; 字段（每节一个清理项，节名即 ID，只许小写字母数字）：
;   name     = 界面显示名（必填）
;   group    = 分组，只许这三个值：浏览器缓存 / 应用缓存 / AI 应用缓存（必填）
;   desc     = 说明文字（建议必填）
;   risk     = warn 为「谨慎」，留空为安全（默认）
;   renew    = 1 表示「边用边长」显示口径（程序活着就写回）
;   heavy    = 1 表示「你的文件」显示口径（清了不可逆 / 是用户自己的东西）
;   na       = 1 表示默认不勾（删了不可逆或本就是用户数据，一键清理不替用户做决定）
;   detect1..N  = 软件安装探测路径（任一存在该项才显示；可含通配）
;   dir1..N     = 固定目录（清空内容，保留目录本身）
;   filekey1..N = 通配枚举（* 单段、** 任意深度、文件名通配）
;   electron1..N = Electron/Chromium 系快捷写法，展开为该 base 下的
;                  **\Cache、**\Code Cache、**\Service Worker\CacheStorage、Cache、Code Cache
;   find1..N     = 数据根全盘搜索声明（软件数据目录可能被用户搬到任意盘时用，2026-11-12 数据化）。
;                  语法：特征目录名[;特征目录名…] | 子目录glob[;子目录glob…]
;                  例子：find1 = Tencent Files | *\nt_qq\nt_data\Emoji;*\nt_qq\nt_data\log
;                  行为：候选根 = %Documents% + 各固定盘根，BFS 深度 3 按目录名找「特征目录名」
;                  （大小写不敏感；Windows/Program Files 等系统目录不进），命中后把每条
;                  子目录 glob 拼在数据根下枚举。可与 dir/filekey 同节并用，路径去重防双算。
;                  ⚠️ 子目录写什么就清什么 —— 聊天记录、用户文件目录（msg、db_storage、Pic…）别写进来。
;   gofind1..N   = Go 侧特型 finder 名（目前仅 browserold：比版本号留最新 + 便携保护，
;                  逻辑无法用数据表达）。写错名字 = 该条返回空、只影响这一条。
;   exclude1..N = 枚举结果排除（路径包含任一子串则丢弃）
;
; 路径变量：%LocalAppData% %AppData% %UserProfile% %Documents% %LocalLow%
;          %ProgramData% %WinDir% %ProgramFiles% %ProgramFiles86%
;
; ⚠️ 语法刻意阉割（误报治理红线）：本格式永远不提供命令执行、注册表删除、
;    网络下载能力；新增字段必须保持「只能描述删哪些文件」。
; ============================================================================

; ================================ 浏览器缓存 ================================

[edgecache]
name = Edge 浏览器缓存
group = 浏览器缓存
desc = 所有配置文件的网页/脚本/GPU 缓存、Service Worker 缓存、组件更新包缓存（component_crx），不影响收藏与密码
renew = 1
filekey1 = %LocalAppData%\Microsoft\Edge\User Data\*\Cache
filekey2 = %LocalAppData%\Microsoft\Edge\User Data\*\Code Cache
filekey3 = %LocalAppData%\Microsoft\Edge\User Data\*\GPUCache
filekey4 = %LocalAppData%\Microsoft\Edge\User Data\*\Service Worker\CacheStorage
filekey5 = %LocalAppData%\Microsoft\Edge\User Data\*\Service Worker\ScriptCache
filekey6 = %LocalAppData%\Microsoft\Edge\User Data\component_crx_cache
filekey7 = %LocalAppData%\Microsoft\Edge\User Data\GrShaderCache
filekey8 = %LocalAppData%\Microsoft\Edge\User Data\ShaderCache

[edgeai]
name = Edge AI 组件数据
group = 浏览器缓存
desc = Edge 智能功能下载的图像溯源/AI 模型数据（ProvenanceData），删除后用到时会自动重新下载
risk = warn
renew = 1
detect1 = %LocalAppData%\Microsoft\Edge\User Data
dir1 = %LocalAppData%\Microsoft\Edge\User Data\ProvenanceData
dir2 = %LocalAppData%\Microsoft\Edge\User Data\ProvenanceDataTensors

[browupdate]
name = 浏览器更新安装包
group = 浏览器缓存
desc = Chrome/Edge 升级后留在 Application\版本\Installer 里的安装包与安装器（如 chrome.7z，单个可达数百 MB），删除不影响浏览器运行，更新时会自动重建
risk = warn
renew = 1
filekey1 = %LocalAppData%\Google\Chrome\Application\*\Installer
filekey2 = %ProgramFiles%\Google\Chrome\Application\*\Installer
filekey3 = %ProgramFiles86%\Google\Chrome\Application\*\Installer
filekey4 = %LocalAppData%\Microsoft\Edge\Application\*\Installer
filekey5 = %ProgramFiles%\Microsoft\Edge\Application\*\Installer
filekey6 = %ProgramFiles86%\Microsoft\Edge\Application\*\Installer

[browserold]
name = 浏览器旧版本残留
group = 浏览器缓存
desc = Chrome/Edge 的 Application 目录里同时存在多个版本时，仅保留最新版本，其余旧版本整个清理；检测到便携增强套件（chrome++）时整位置跳过
risk = warn
gofind1 = browserold

[chromecache]
name = Chrome 浏览器缓存
group = 浏览器缓存
desc = 所有配置文件的网页/脚本/GPU 缓存、Service Worker 缓存、组件更新包缓存（component_crx），不影响收藏与密码
renew = 1
detect1 = %LocalAppData%\Google\Chrome
filekey1 = %LocalAppData%\Google\Chrome\User Data\*\Cache
filekey2 = %LocalAppData%\Google\Chrome\User Data\*\Code Cache
filekey3 = %LocalAppData%\Google\Chrome\User Data\*\GPUCache
filekey4 = %LocalAppData%\Google\Chrome\User Data\*\Service Worker\CacheStorage
filekey5 = %LocalAppData%\Google\Chrome\User Data\*\Service Worker\ScriptCache
filekey6 = %LocalAppData%\Google\Chrome\User Data\component_crx_cache
filekey7 = %LocalAppData%\Google\Chrome\User Data\GrShaderCache
filekey8 = %LocalAppData%\Google\Chrome\User Data\ShaderCache

[chromium]
name = 其他 Chromium 浏览器缓存
group = 浏览器缓存
desc = 自动枚举 360/QQ/Brave/Vivaldi 等 Chromium 系浏览器
renew = 1
; 2026-11-12 修：只 glob Default 会漏掉多配置（Profile 1/2…），改为 * 全 Profile，
; 与 Edge/Chrome 项同一口径
filekey1 = %LocalAppData%\**\User Data\*\Cache
filekey2 = %LocalAppData%\**\User Data\*\GPUCache
exclude1 = \google\
exclude2 = \microsoft\

[firefox]
name = Firefox 浏览器缓存
group = 浏览器缓存
desc = 自动枚举所有配置文件的 cache2 缓存
renew = 1
filekey1 = %AppData%\Mozilla\Firefox\Profiles\*\cache2
filekey2 = %LocalAppData%\Mozilla\Firefox\Profiles\*\cache2

[iecache]
name = IE / 系统网页缓存
group = 浏览器缓存
desc = INetCache 网页缓存与老式 IE 临时目录（UWP 应用共用）
renew = 1
dir1 = %LocalAppData%\Microsoft\Windows\INetCache
dir2 = %LocalAppData%\Microsoft\Windows\Temporary Internet Files

[cookies]
name = 浏览器 Cookies
group = 浏览器缓存
desc = 清空后所有网站需要重新登录
risk = warn
renew = 1
heavy = 1
na = 1
dir1 = %LocalAppData%\Microsoft\Windows\INetCookies

