[wechatcache]
name = 微信缓存
group = 应用缓存
desc = 按账号自动枚举微信 3.x/4.x 缓存与运行日志，不含聊天文件
renew = 1
detect1 = %Documents%\WeChat Files
detect2 = %Documents%\xwechat_files
detect3 = %AppData%\Tencent\WeChat
detect4 = %AppData%\Tencent\xwechat
filekey1 = %Documents%\WeChat Files\*\FileStorage\Cache
filekey2 = %Documents%\xwechat_files\*\FileStorage\Cache
filekey3 = %Documents%\xwechat_files\*\cache
filekey4 = %AppData%\Tencent\WeChat\*\Cache
; 微信 4.x Roaming 数据目录（实测 xwechat\log 82MB，旧定义完全没覆盖）
dir1 = %AppData%\Tencent\xwechat\log
dir2 = %AppData%\Tencent\xwechat\crashinfo
; find 声明：数据目录被用户改到任意固定盘（如 D:\App Data\We Chat\xwechat_files）时全盘兜底发现
; 4.x（xwechat_files）账号目录下是 cache/temp；3.x（WeChat Files）是 FileStorage\Cache；msg/db_storage 聊天记录不收
find1 = xwechat_files | *\cache;*\temp
find2 = WeChat Files | *\FileStorage\Cache

